

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscoControl - Contador de Aforo Avanzado</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Estilo base y variables de tema */
        :root {
            --color-primary: 34, 97, 255; 
            --color-secondary: 51, 65, 85;
            --color-background: 241, 245, 249;
            --color-text: 15, 23, 42;
            --color-card: 255, 255, 255;
            --color-border: 226, 232, 240;
            --color-success: 22, 163, 74;
            --color-warning: 234, 179, 8;
            --color-danger: 220, 38, 38;
        }
        /* --- NUEVOS TEMAS DEL DASHBOARD Y PORTERO --- */
        .theme-blue-nebula, .theme-neon-tech, .theme-dark-emerald, .theme-vibrant-purple {
            /* Propiedades comunes de temas oscuros */
            --color-border: 51, 65, 85;
            --color-secondary: 100, 116, 139; /* Slate 500 */
        }
        
        .theme-blue-nebula {
            --color-primary: 30, 144, 255; /* Dodger Blue */
            --color-background: 10, 25, 47; /* Dark Navy */
            --color-card: 20, 40, 70; /* Slightly lighter Navy */
            --color-text: 224, 242, 254; /* Light Blue tint */
        }
        .theme-neon-tech {
            --color-primary: 236, 72, 153; /* Pink 500 (Para el efecto neón) */
            --color-background: 2, 6, 23; /* Very Dark Blue (El fondo oscuro) */
            --color-card: 43, 13, 33; /* Dark Pink/Purple */
            --color-text: 254, 202, 202; /* Red tint */
        }
        .theme-dark-emerald {
            --color-primary: 16, 185, 129; /* Emerald 500 */
            --color-background: 25, 33, 25; /* Dark Green */
            --color-card: 40, 50, 40; /* Darker Forest Green */
            --color-text: 209, 250, 229; /* Light Green tint */
        }
        .theme-vibrant-purple {
            --color-primary: 168, 85, 247; /* Violet 500 */
            --color-background: 20, 20, 30; /* Very Dark Grey */
            --color-card: 45, 45, 60; /* Dark Purple-Grey */
            --color-text: 233, 213, 255; /* Light Violet */
        }
        
        /* === FIX: ASEGURAR QUE EL FONDO CUBRA TODA LA PÁGINA === */
        html {
            height: 100%; /* El html debe tomar el 100% del viewport */
        }
        
        /* Para aplicar colores a las vistas específicas */
        #portero-view.theme-blue-nebula, #portero-view.theme-neon-tech, #portero-view.theme-dark-emerald, #portero-view.theme-vibrant-purple {
            background-color: rgb(var(--color-background));
            color: rgb(var(--color-text));
        }
        /* Clases de utilidad para colores dinámicos */
        body { 
            min-height: 100vh; /* Asegura que el body siempre tenga al menos el alto de la ventana */
            font-family: 'Inter', sans-serif; 
            background-color: rgb(var(--color-background)); /* Color de fondo dinámico */
            color: rgb(var(--color-text)); 
            transition: background-color 0.3s, color 0.3s; 
        }
        /* El contenedor de la app necesita la misma altura mínima si el body no lo hace */
        #app-container {
            min-height: 100vh; 
        }
        .bg-primary { background-color: rgb(var(--color-primary)); }
        .text-primary { color: rgb(var(--color-primary)); }
        .border-primary { border-color: rgb(var(--color-primary)); }
        .ring-primary { ring-color: rgb(var(--color-primary)); }
        .bg-secondary { background-color: rgb(var(--color-secondary)); }
        .bg-card { background-color: rgb(var(--color-card)); }
        .border-default { border-color: rgb(var(--color-border)); }
        .text-danger { color: rgb(var(--color-danger)); }
        .bg-danger { background-color: rgb(var(--color-danger)); }
        .bg-success { background-color: rgb(var(--color-success)); }
        .bg-warning { background-color: rgb(var(--color-warning)); }
        .bg-background { background-color: rgb(var(--color-background)); }
        .text-text { color: rgb(var(--color-text)); }
        
        /* Animaciones */
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
        }
        @keyframes pulse-yellow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(234, 179, 8, 0); }
        }
        .pulse-alert { animation: pulse-red 2s infinite; }
        .pulse-warning { animation: pulse-yellow 2s infinite; }
        /* Scrollbar personalizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgb(var(--color-background)); }
        ::-webkit-scrollbar-thumb { background: rgba(var(--color-primary), 0.6); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(var(--color-primary), 0.8); }
        /* Clases para ocultar/mostrar vistas */
        .hidden-view { display: none !important; }
        /* Estilo para los selectores de tema para que el texto sea visible */
        select.theme-selector {
            background-color: rgba(var(--color-card), 0.8);
            color: rgb(var(--color-text));
            border-radius: 8px;
            padding: 4px 8px;
            border: 1px solid rgba(var(--color-border));
        }
        select.theme-selector option {
            background-color: rgb(var(--color-card));
            color: rgb(var(--color-text));
        }
    </style>
</head>
<body>
    <!-- Contenedor principal de la aplicación -->
    <div id="app-container" class="min-h-screen w-full transition-all duration-300">
        <!-- Pantalla de Login (simulada) -->
        <div id="login-view" class="flex flex-col items-center justify-center min-h-screen p-4">
            <div class="w-full max-w-md text-center">
                <i class="fas fa-ticket-alt text-primary text-6xl mb-4"></i>
                <h1 class="text-4xl font-bold mb-2">DiscoControl</h1>
                <p class="text-lg opacity-80 mb-8" data-lang="login_subtitle">Gestión de aforo inteligente.</p>
                <div class="bg-card p-6 rounded-2xl shadow-lg border border-default">
                
                    <h2 class="text-2xl font-semibold mb-6" data-lang="login_select_role">Selecciona tu rol</h2>
                
                    <div class="grid grid-cols-1 gap-4">
                
                        <button onclick="loginAs('portero')" class="w-full text-left flex items-center p-4 bg-primary/10 hover:bg-primary/20 rounded-lg transition-all duration-200">
                
                            <i class="fas fa-user-shield w-8 text-primary text-2xl"></i>
                
                            <span class="ml-4 font-semibold" data-lang="role_doorman">Portero</span>
                
                        </button>
                
                        <button onclick="loginAs('director')" class="w-full text-left flex items-center p-4 bg-primary/10 hover:bg-primary/20 rounded-lg transition-all duration-200">
                
                            <i class="fas fa-chart-line w-8 text-primary text-2xl"></i>
                
                            <span class="ml-4 font-semibold" data-lang="role_manager">Director</span>
                
                        </button>
                
                        <button onclick="loginAs('dueño')" class="w-full text-left flex items-center p-4 bg-primary/10 hover:bg-primary/20 rounded-lg transition-all duration-200">
                
                            <i class="fas fa-crown w-8 text-primary text-2xl"></i>
                
                            <span class="ml-4 font-semibold" data-lang="role_owner">Dueño</span>
                
                        </button>
                
                    </div>
                </div>
            </div>
        </div>
        <!-- Vista del Portero -->
        <div id="portero-view" class="hidden-view flex flex-col h-screen p-4 transition-colors duration-300">
            <header class="flex justify-between items-center mb-4">
                <div>
                
                    <h1 class="text-xl font-bold">Disco Murano</h1>
                
                    <p class="text-sm opacity-70">Turno: 22:00 - 06:00</p>
                </div>
                <div class="flex items-center space-x-2">
                
                    <select id="portero-theme-switcher" class="theme-selector bg-transparent border-default focus:ring-0">
                
                        <option value="theme-blue-nebula" data-lang="theme_blue_nebula">Nebulosa Azul</option>
                
                        <option value="theme-neon-tech" data-lang="theme_neon_tech">Tecno Rosa</option>
                
                        <option value="theme-dark-emerald" data-lang="theme_dark_emerald">Esmeralda Oscura</option>
                
                        <option value="theme-vibrant-purple" data-lang="theme_vibrant_purple">Púrpura Vibrante</option>
                
                    </select>
                
                    <button onclick="logout()" class="p-3 rounded-full hover:bg-white/10 text-xl"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </header>
            <main class="flex-grow flex flex-col items-center justify-center text-center">
                <!-- Anillo de Capacidad Total -->
                <div id="capacity-ring" class="relative w-64 h-64 md:w-80 md:h-80 rounded-full flex items-center justify-center transition-all duration-300 bg-card shadow-lg border-8 border-default">
                
                    <div class="text-center">
                
                        <p id="current-count-portero" class="text-7xl md:text-8xl font-black">0</p>
                
                        <p class="text-lg opacity-80">/ <span id="max-capacity-portero">300</span></p>
                
                    </div>
                </div>
                <p id="capacity-status" class="mt-4 font-semibold text-lg"></p>
                
                <!-- Estadísticas de Género -->
                <div id="gender-stats" class="grid grid-cols-2 gap-4 mt-6 w-full max-w-lg">
                
                    <div class="bg-card p-4 rounded-xl shadow border border-default">
                
                        <p class="text-sm opacity-70 flex items-center mb-1 text-blue-500"><i class="fas fa-male text-lg mr-2"></i> <span data-lang="gender_men_title">Hombres</span></p>
                
                        <p id="men-count-portero" class="text-3xl font-bold">0</p>
                
                        <p id="men-percentage-portero" class="text-xs opacity-60 mt-1"></p>
                
                    </div>
                
                    <div class="bg-card p-4 rounded-xl shadow border border-default">
                
                        <p class="text-sm opacity-70 flex items-center mb-1 text-pink-500"><i class="fas fa-female text-lg mr-2"></i> <span data-lang="gender_women_title">Mujeres</span></p>
                
                        <p id="women-count-portero" class="text-3xl font-bold">0</p>
                
                        <p id="women-percentage-portero" class="text-xs opacity-60 mt-1"></p>
                
                    </div>
                </div>
            </main>
            <!-- Botones de Control por Género -->
            <footer class="grid grid-cols-2 gap-4">
                <!-- Controles de Hombres -->
                <div class="flex flex-col space-y-2">
                
                    <p class="text-xs font-semibold opacity-80 text-center uppercase text-blue-400" data-lang="gender_men">Hombres</p>
                
                    <div class="grid grid-cols-2 gap-2">
                
                        <button onclick="updateCount(-1, 'men')" class="bg-danger/80 text-white rounded-xl py-4 text-2xl font-bold active:scale-95 transition-transform duration-150 shadow-lg hover:bg-danger/100"><i class="fas fa-minus"></i></button>
                
                        <button onclick="updateCount(1, 'men')" class="bg-blue-600 text-white rounded-xl py-4 text-2xl font-bold active:scale-95 transition-transform duration-150 shadow-lg hover:bg-blue-700"><i class="fas fa-plus"></i></button>
                
                    </div>
                </div>
                <!-- Controles de Mujeres -->
                <div class="flex flex-col space-y-2">
                
                    <p class="text-xs font-semibold opacity-80 text-center uppercase text-pink-400" data-lang="gender_women">Mujeres</p>
                
                    <div class="grid grid-cols-2 gap-2">
                
                        <button onclick="updateCount(-1, 'women')" class="bg-danger/80 text-white rounded-xl py-4 text-2xl font-bold active:scale-95 transition-transform duration-150 shadow-lg hover:bg-danger/100"><i class="fas fa-minus"></i></button>
                
                        <button onclick="updateCount(1, 'women')" class="bg-pink-600 text-white rounded-xl py-4 text-2xl font-bold active:scale-95 transition-transform duration-150 shadow-lg hover:bg-pink-700"><i class="fas fa-plus"></i></button>
                
                    </div>
                </div>
            </footer>
        </div>
        <!-- Vista del Director / Dueño (Dashboard) -->
        <div id="dashboard-view" class="hidden-view">
            <div class="md:flex min-h-screen"> <!-- Aseguramos que el contenedor de flex tome el alto -->
                <!-- Barra lateral (se oculta en móvil) -->
                <aside id="sidebar" class="w-64 bg-card border-r border-default p-4 flex-col md:flex fixed h-full -translate-x-full md:translate-x-0 transition-transform duration-300 z-20">
                
                    <div class="flex items-center mb-8">
                
                        <i class="fas fa-ticket-alt text-primary text-3xl"></i>
                
                        <h1 class="text-2xl font-bold ml-2">DiscoControl</h1>
                
                    </div>
                
                    <nav id="main-nav" class="flex-grow">
                
                        <!-- Los enlaces se generan dinámicamente -->
                
                    </nav>
                
                    <div class="mt-auto">
                
                        <button onclick="logout()" class="w-full text-left flex items-center p-3 hover:bg-primary/10 rounded-lg transition-colors duration-200">
                
                            <i class="fas fa-sign-out-alt w-8 opacity-70"></i>
                
                            <span data-lang="logout">Cerrar Sesión</span>
                
                        </button>
                
                    </div>
                </aside>
                
                <!-- Contenido principal -->
                <main id="main-content" class="flex-1 md:ml-64 transition-all duration-300">
                
                    <header class="bg-card/80 backdrop-blur-sm sticky top-0 z-10 border-b border-default p-4 flex justify-between items-center">
                
                        <button id="menu-toggle" class="md:hidden p-2 -ml-2">
                
                            <i class="fas fa-bars text-2xl"></i>
                
                        </button>
                
                        <h2 id="dashboard-title" class="text-xl font-semibold"></h2>
                
                        <div class="flex items-center space-x-4">
                
                            <!-- Selector de Idioma -->
                
                            <select id="language-switcher" class="bg-transparent border-none focus:ring-0 text-text">
                
                                <option value="es">ES</option>
                
                                <option value="en">EN</option>
                
                            </select>
                
                            <!-- Selector de Tema -->
                
                            <select id="theme-switcher" class="bg-transparent border-none focus:ring-0 text-text">
                
                                <option value="theme-blue-nebula" data-lang="theme_blue_nebula">Nebulosa Azul</option>
                
                                <option value="theme-neon-tech" data-lang="theme_neon_tech">Tecno Rosa</option>
                
                                <option value="theme-dark-emerald" data-lang="theme_dark_emerald">Esmeralda Oscura</option>
                
                                <option value="theme-vibrant-purple" data-lang="theme_vibrant_purple">Púrpura Vibrante</option>
                
                            </select>
                
                        </div>
                
                    </header>
                
                    <div id="dashboard-content" class="p-4 md:p-6">
                
                        <!-- El contenido de cada sección se inyecta aquí -->
                
                    </div>
                </main>
            </div>
        </div>
    </div>
    
    <!-- Modal de alerta de aforo -->
    <div id="alert-modal" class="hidden-view fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-card rounded-2xl p-8 text-center max-w-sm w-full shadow-2xl">
            <i id="alert-icon" class="fas fa-exclamation-triangle text-danger text-5xl mb-4"></i>
            <h3 id="alert-title" class="text-2xl font-bold" data-lang="alert_capacity_title">¡Alerta!</h3>
            <p id="alert-text" class="opacity-80 mt-2 mb-6" data-lang="alert_capacity_text">Mensaje de Alerta.</p>
            <button onclick="closeModal()" class="bg-primary text-white px-6 py-2 rounded-lg font-semibold" data-lang="alert_capacity_close">Entendido</button>
        </div>
    </div>
    
    <!-- Audio para alerta -->
    <audio id="alert-sound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>
 
    <script>
    // --- STATE MANAGEMENT & MOCK DATA ---
    const AppState = {
        currentUser: null, // 'portero', 'director', 'dueño'
        currentClub: 'murano',
        activeDashboardPage: 'realtime',
        language: 'es',
        theme: 'theme-blue-nebula', // Nuevo tema por defecto
        clubs: {
            'murano': {
                name: 'Disco Murano',
                currentCount: 0,
                menCount: 0,
                womenCount: 0,
                maxCapacity: 300,
                log: [], // { timestamp, type: 'in' | 'out', gender: 'men' | 'women', portero: 'ID' }
            },
            'pacha': {
                name: 'Pachá Ibiza',
                currentCount: 0,
                menCount: 0,
                womenCount: 0,
                maxCapacity: 1500,
                log: [],
            },
            'fabrick': {
                name: 'Fabrik Madrid',
                currentCount: 0,
                menCount: 0,
                womenCount: 0,
                maxCapacity: 4000,
                log: [],
            }
        },
        users: {
            'portero1': { name: 'Carlos García', role: 'portero', club: 'murano' },
            'director1': { name: 'Ana López', role: 'director', club: 'murano' },
            'dueño1': { name: 'Javier Martín', role: 'dueño' }
        },
        mockDataGenerated: false,
    };
    // --- TRANSLATIONS ---
    const translations = {
        es: {
            login_subtitle: "Gestión de aforo inteligente.",
            login_select_role: "Selecciona tu rol",
            role_doorman: "Portero",
            role_manager: "Director",
            role_owner: "Dueño",
            logout: "Cerrar Sesión",
            // Nuevos temas
            theme_blue_nebula: "Nebulosa Azul",
            theme_neon_tech: "Tecno Rosa",
            theme_dark_emerald: "Esmeralda Oscura",
            theme_vibrant_purple: "Púrpura Vibrante",
            // Alertas
            alert_capacity_title: "¡Aforo Máximo Alcanzado!",
            alert_capacity_text: "No se permiten más entradas hasta que alguien salga.",
            alert_imbalance_title: "¡Alerta de Desbalance de Género!",
            alert_imbalance_text: "La proporción de un género supera el 65%. Se recomienda priorizar el acceso al otro género.",
            alert_capacity_close: "Entendido",
            // Género
            gender_men: "Hombres",
            gender_women: "Mujeres",
            gender_men_title:"Hombres",
            gender_women_title: "Mujeres",
            // Dashboard
            dashboard_title_realtime: "Estadísticas en Tiempo Real",
            dashboard_title_history: "Histórico de Datos",
            dashboard_title_users: "Gestión de Usuarios",
            dashboard_title_comparison: "Comparativa de Locales",
            nav_realtime: "Tiempo Real",
            nav_history: "Histórico",
            nav_users: "Usuarios",
            nav_comparison: "Comparativa",
            realtime_current_capacity: "Aforo Actual",
            realtime_max_capacity: "Aforo Máximo",
            realtime_capacity_percentage: "Porcentaje Ocupación",
            realtime_active_doorman: "Portero Activo",
            realtime_gender_ratio: "Ratio de Género",
            history_title: "Registro de Entradas y Salidas",
            users_title: "Administrar Personal",
            users_add: "Añadir Usuario",
            comparison_title:"Rendimiento General",
            cancel: "Cancelar",
            no_data: "No hay datos que mostrar",
        },
        en: {
            login_subtitle: "Intelligent capacity management.",
            login_select_role: "Select your role",
            role_doorman: "Doorman",
            role_manager: "Manager",
            role_owner: "Owner",
            logout: "Logout",
            // Nuevos temas
            theme_blue_nebula: "Blue Nebula",
            theme_neon_tech: "Neon Tech",
            theme_dark_emerald: "Dark Emerald",
            theme_vibrant_purple: "Vibrant Purple",
            // Alertas
            alert_capacity_title: "Maximum Capacity Reached!",
            alert_capacity_text: "No more entries allowed until someone leaves.",
            alert_imbalance_title: "Gender Imbalance Alert!",
            alert_imbalance_text: "The ratio of one gender exceeds 65%. Consider prioritizing the other gender's access.",
            alert_capacity_close: "Understood",
            // Género
            gender_men: "Men",
            gender_women: "Women",
            gender_men_title:"Men",
            gender_women_title: "Women",
            // Dashboard
            dashboard_title_realtime: "Real-Time Statistics",
            dashboard_title_history: "Data History",
            dashboard_title_users: "User Management",
            dashboard_title_comparison: "Venue Comparison",
            nav_realtime: "Real-Time",
            nav_history: "History",
            nav_users: "Users",
            nav_comparison: "Comparison",
            realtime_current_capacity: "Current Capacity",
            realtime_max_capacity: "Max Capacity",
            realtime_capacity_percentage: "Occupancy Percentage",
            realtime_active_doorman: "Active Doorman",
            realtime_gender_ratio: "Gender Ratio",
            history_title: "Entry and Exit Log",
            users_title: "Manage Staff",
            users_add: "Add User",
            comparison_title:"Overall Performance",
            cancel: "Cancel",
            no_data: "No data to display",
        }
    };
    
    // --- DOM ELEMENTS ---
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => document.querySelectorAll(selector);
    const THEMES = ['theme-blue-nebula', 'theme-neon-tech', 'theme-dark-emerald', 'theme-vibrant-purple'];
    
    // --- CORE LOGIC ---
    document.addEventListener('DOMContentLoaded', () => {
        generateMockData();
        
        // Event listeners for theme and language switchers
        $('#portero-theme-switcher').addEventListener('change', (e) => switchTheme(e.target.value));
        $('#theme-switcher').addEventListener('change', (e) => switchTheme(e.target.value));
        $('#language-switcher').addEventListener('change', (e) => switchLanguage(e.target.value));
        $('#menu-toggle').addEventListener('click', () => $('#sidebar').classList.toggle('-translate-x-full'));
    });
    
    function loginAs(role) {
        AppState.currentUser = role;
        $('#login-view').classList.add('hidden-view');
        // Limpiar clases de tema previas
        document.body.className = '';
        $('#portero-view').classList.remove(...THEMES);
        if (role === 'portero') {
            $('#portero-view').classList.remove('hidden-view');
            $('#portero-view').classList.add(AppState.theme);
            updatePorteroView();
        } else { // Director or Dueño
            $('#dashboard-view').classList.remove('hidden-view');
            document.body.className = AppState.theme;
            setupDashboard();
        }
        
        // Sincronizar selectores y actualizar idioma
        $('#theme-switcher').value = AppState.theme;
        $('#portero-theme-switcher').value = AppState.theme;
        updateLanguage();
    }
    
    function logout() {
        AppState.currentUser = null;
        document.body.className = '';
        $('#portero-view').classList.remove(...THEMES);
        $('#login-view').classList.remove('hidden-view');
        $('#portero-view').classList.add('hidden-view');
        $('#dashboard-view').classList.add('hidden-view');
    }
    
    // --- GENERAL FUNCTIONS ---
    function switchTheme(newTheme) {
        AppState.theme = newTheme;
        
        // Update Body (for Dashboard views)
        document.body.classList.remove(...THEMES);
        document.body.classList.add(newTheme);
        
        // Update Portero View
        $('#portero-view').classList.remove(...THEMES);
        $('#portero-view').classList.add(newTheme);
        
        // Sync selectors
        const porteroSelector = $('#portero-theme-switcher');
        if(porteroSelector) porteroSelector.value = newTheme;
        const dashboardSelector = $('#theme-switcher');
        if(dashboardSelector) dashboardSelector.value = newTheme;
        // Re-render chart to pick up new theme colors (simple way)
        if (AppState.currentUser !== 'portero' && AppState.activeDashboardPage === 'realtime') {
            renderRealTimePage();
        }
    }
    
    function switchLanguage(lang) {
        AppState.language = lang;
        updateLanguage();
    }
    
    function updateLanguage() {
        const lang = AppState.language;
        const dict = translations[lang];
        $$('[data-lang]').forEach(el => {
            const key = el.dataset.lang;
            if (dict[key]) {
                el.textContent = dict[key];
                // For input placeholders if needed
                if (el.tagName === 'INPUT' && el.type === 'text') {
                    el.placeholder = dict[key];
                }
            }
        });
        // Re-render dashboard title
        if(AppState.currentUser !== 'portero') {
            $('#dashboard-title').textContent = dict[`dashboard_title_${AppState.activeDashboardPage}`];
        }
        // Update navigation text
        setupDashboardNav();
    }
    
    // --- PORTERO VIEW LOGIC (NEW LOGIC) ---
    /**
     * Updates the count based on change (+1 or -1) and gender.
     * @param {number} change - 1 for entry, -1 for exit.
     * @param {string} gender - 'men' or 'women'.
     */
    function updateCount(change, gender) {
        const club = AppState.clubs[AppState.currentClub];
        const countKey = `${gender}Count`;
        const newTotalCount = club.currentCount + change;
        const newGenderCount = club[countKey] + change;
        
        // Restriction 1: Hard Stop at 0 (No negative people)
        if (newGenderCount < 0) {
            console.warn(`Attempted to decrement ${gender} below zero.`);
            return;
        }
        
        // Restriction 2: Max Capacity Check (Only on entry)
        if (change === 1 && newTotalCount > club.maxCapacity) {
            triggerAlert('capacity');
            return;
        }
        
        // 1. Update Counts
        club.currentCount = newTotalCount;
        club[countKey] = newGenderCount;
        
        // 2. Log Entry
        club.log.push({
            timestamp: new Date(),
            type: change === 1 ? 'in' : 'out',
            gender: gender,
            portero: 'portero1'
        });
        
        // 3. Update UI and Check Alerts
        updatePorteroView();
        checkGenderImbalance(club);
        
        // 4. Update Dashboard if visible
        if (AppState.currentUser !== 'portero' && AppState.activeDashboardPage === 'realtime') {
            renderRealTimePage();
        }
    }
    
    // Restriction 3: Gender Imbalance Check (65%/35% rule)
    function checkGenderImbalance(club) {
        const total = club.currentCount;
        if (total < 10) {
            // Ignore for low counts
            $('#capacity-ring').classList.remove('pulse-warning');
            return;
        }
        
        const menRatio = club.menCount / total;
        const womenRatio = club.womenCount / total;
        const imbalanceThreshold = 0.65; // 65%
        
        if (menRatio > imbalanceThreshold || womenRatio > imbalanceThreshold) {
            triggerAlert('imbalance');
            $('#capacity-ring').classList.add('pulse-warning');
        } else {
            $('#capacity-ring').classList.remove('pulse-warning');
        }
    }
    
    function updatePorteroView() {
        const club = AppState.clubs[AppState.currentClub];
        const percentage = club.maxCapacity > 0 ? (club.currentCount / club.maxCapacity) * 100 : 0;
        const total = club.currentCount;
        
        // Update Total Count
        $('#current-count-portero').textContent = club.currentCount;
        $('#max-capacity-portero').textContent = club.maxCapacity;
        
        // Update Gender Counts
        $('#men-count-portero').textContent = club.menCount;
        $('#women-count-portero').textContent = club.womenCount;
        
        // Calculate Gender Percentages
        const menPercent = total > 0 ? ((club.menCount / total) * 100).toFixed(0) : 0;
        const womenPercent = total > 0 ? ((club.womenCount / total) * 100).toFixed(0) : 0;
        $('#men-percentage-portero').textContent = `(${menPercent}%)`;
        $('#women-percentage-portero').textContent = `(${womenPercent}%)`;
        
        // Update Ring Color and Capacity Status
        const capacityRing = $('#capacity-ring');
        
        // Color gradient from green (0) to red (100)
        capacityRing.style.borderColor = `hsl(${120 - (percentage * 1.2)}, 80%, 50%)`;
        
        const statusEl = $('#capacity-status');
        capacityRing.classList.remove('pulse-alert'); // Remove capacity alert if status changes
        if (percentage >= 100) {
            statusEl.textContent = "AFORO COMPLETO";
            statusEl.className = "mt-4 font-semibold text-lg text-danger";
            capacityRing.classList.add('pulse-alert');
        } else if (percentage > 90) {
            statusEl.textContent = "Aforo casi lleno";
            statusEl.className = "mt-4 font-semibold text-lg text-warning";
        } else {
            statusEl.textContent = "Aforo disponible";
            statusEl.className = "mt-4 font-semibold text-lg text-success";
        }
        
        checkGenderImbalance(club); // Re-check imbalance status
    }
    
    /**
     * Triggers the alert modal based on alert type.
     * @param {string} type - 'capacity' or 'imbalance'.
     */
    function triggerAlert(type) {
        const lang = AppState.language;
        const dict = translations[lang];
        
        if (type === 'capacity') {
            $('#alert-icon').className = 'fas fa-exclamation-triangle text-danger text-5xl mb-4';
            $('#alert-title').textContent = dict.alert_capacity_title;
            $('#alert-text').textContent = dict.alert_capacity_text;
        } else if (type === 'imbalance') {
            $('#alert-icon').className = 'fas fa-balance-scale-right text-warning text-5xl mb-4';
            $('#alert-title').textContent = dict.alert_imbalance_title;
            $('#alert-text').textContent = dict.alert_imbalance_text;
        }
        
        $('#alert-modal').classList.remove('hidden-view');
        // Usamos una promesa para garantizar la reproducción en navegadores modernos
        $('#alert-sound').play().catch(e => console.error("No se pudo reproducir el sonido de alerta:", e));
    }
    function closeModal() {
        $('#alert-modal').classList.add('hidden-view');
    }
    
    // --- DASHBOARD LOGIC (MOCK) ---
    function setupDashboard() {
        setupDashboardNav();
        navigateTo(AppState.activeDashboardPage);
    }
    function setupDashboardNav() {
        const navEl = $('#main-nav');
        navEl.innerHTML = '';
        const dict = translations[AppState.language];
        
        const pages = [
            { id: 'realtime', icon: 'fas fa-tachometer-alt', label: dict.nav_realtime },
            { id: 'history', icon: 'fas fa-history', label: dict.nav_history },
            { id: 'users', icon: 'fas fa-users', label: dict.nav_users },
            { id: 'comparison', icon: 'fas fa-chart-bar', label: dict.nav_comparison },
        ];
        pages.forEach(page => {
            const isActive = AppState.activeDashboardPage === page.id;
            const item = document.createElement('a');
            item.href = '#';
            item.className = `flex items-center p-3 rounded-lg transition-colors duration-200 mb-1 ${isActive ? 'bg-primary/20 text-primary font-semibold' : 'hover:bg-primary/10 opacity-80'}`;
            item.innerHTML = `<i class="${page.icon} w-8"></i><span data-lang="nav_${page.id}">${page.label}</span>`;
            item.onclick = (e) => {
                e.preventDefault();
                navigateTo(page.id);
            };
            navEl.appendChild(item);
        });
    }
    function navigateTo(pageId) {
        AppState.activeDashboardPage = pageId;
        const contentEl = $('#dashboard-content');
        const dict = translations[AppState.language];
        $('#dashboard-title').textContent = dict[`dashboard_title_${pageId}`];
        setupDashboardNav(); // Re-render nav to highlight active page
        // Close sidebar on mobile after navigation
        $('#sidebar').classList.add('-translate-x-full'); 
        switch (pageId) {
            case 'realtime':
                renderRealTimePage(contentEl);
                break;
            case 'history':
                renderHistoryPage(contentEl);
                break;
            case 'users':
                renderUsersPage(contentEl);
                break;
            case 'comparison':
                renderComparisonPage(contentEl);
                break;
            default:
                contentEl.innerHTML = `<p class="text-center mt-10">${dict.no_data}</p>`;
        }
    }
    let realtimeChart = null;
    function renderRealTimePage(container = $('#dashboard-content')) {
        const club = AppState.clubs[AppState.currentClub];
        const dict = translations[AppState.language];
        const primaryColor = getComputedStyle(document.body).getPropertyValue('--color-primary').trim();
        const cardColor = getComputedStyle(document.body).getPropertyValue('--color-card').trim();
        const textColor = getComputedStyle(document.body).getPropertyValue('--color-text').trim();
        
        const capacityPercentage = club.maxCapacity > 0 ? ((club.currentCount / club.maxCapacity) * 100).toFixed(1) : 0;
        const menRatio = club.currentCount > 0 ? ((club.menCount / club.currentCount) * 100).toFixed(1) : 0;
        const womenRatio = club.currentCount > 0 ? ((club.womenCount / club.currentCount) * 100).toFixed(1) : 0;
        container.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <!-- Card 1: Aforo Actual -->
                <div class="bg-card p-6 rounded-xl shadow border border-default">
                    <p class="text-sm opacity-70" data-lang="realtime_current_capacity">${dict.realtime_current_capacity}</p>
                    <p class="text-4xl font-bold text-primary mt-1">${club.currentCount}</p>
                    <p class="text-sm opacity-60">/ ${club.maxCapacity} ${dict.realtime_max_capacity}</p>
                </div>
                <!-- Card 2: Porcentaje de Ocupación -->
                <div class="bg-card p-6 rounded-xl shadow border border-default">
                    <p class="text-sm opacity-70" data-lang="realtime_capacity_percentage">${dict.realtime_capacity_percentage}</p>
                    <p class="text-4xl font-bold mt-1 ${capacityPercentage >= 90 ? 'text-danger' : 'text-success'}">${capacityPercentage}%</p>
                    <p class="text-sm opacity-60">(${club.maxCapacity - club.currentCount} ${dict.realtime_max_capacity.toLowerCase()})</p>
                </div>
                <!-- Card 3: Portero Activo (Mock) -->
                <div class="bg-card p-6 rounded-xl shadow border border-default">
                    <p class="text-sm opacity-70" data-lang="realtime_active_doorman">${dict.realtime_active_doorman}</p>
                    <p class="text-xl font-bold mt-2">Carlos García</p>
                    <p class="text-sm opacity-60">ID: portero1</p>
                </div>
            </div>
            <!-- Gráfico de Ratio de Género -->
            <div class="bg-card p-6 rounded-xl shadow border border-default">
                <h3 class="text-lg font-semibold mb-4" data-lang="realtime_gender_ratio">${dict.realtime_gender_ratio}</h3>
                <div class="h-64">
                    <canvas id="genderChart"></canvas>
                </div>
                <div class="flex justify-around text-center mt-4">
                    <div>
                        <p class="text-2xl font-bold text-blue-500">${menRatio}%</p>
                        <p class="text-sm opacity-70" data-lang="gender_men">${dict.gender_men}</p>
                    </div>
                    <div>
                        <p class="text-2xl font-bold text-pink-500">${womenRatio}%</p>
                        <p class="text-sm opacity-70" data-lang="gender_women">${dict.gender_women}</p>
                    </div>
                </div>
            </div>
        `;
        
        const ctx = $('#genderChart').getContext('2d');
        // Destruir la instancia anterior del gráfico si existe
        if (realtimeChart) {
            realtimeChart.destroy();
        }
        // Configuración para el gráfico Doughnut
        realtimeChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: [dict.gender_men, dict.gender_women],
                datasets: [{
                    data: [club.menCount, club.womenCount],
                    backgroundColor: [
                        'rgba(59, 130, 246, 0.8)', // Tailwind blue-500
                        'rgba(236, 72, 153, 0.8)' // Tailwind pink-500
                    ],
                    borderColor: `rgb(${cardColor})`,
                    borderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: `rgb(${textColor})`,
                            font: {
                                family: 'Inter',
                                size: 14,
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(tooltipItem) {
                                let label = tooltipItem.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                label += new Intl.NumberFormat('es-ES', { style: 'decimal' }).format(tooltipItem.raw);
                                return label;
                            }
                        }
                    }
                }
            }
        });
    }
    function renderHistoryPage(container = $('#dashboard-content')) {
        const club = AppState.clubs[AppState.currentClub];
        const dict = translations[AppState.language];
        
        container.innerHTML = `
            <div class="bg-card p-6 rounded-xl shadow border border-default">
                <h3 class="text-xl font-semibold mb-4" data-lang="history_title">${dict.history_title} (${club.name})</h3>
                <div class="overflow-x-auto h-96">
                    <table class="min-w-full divide-y divide-default">
                        <thead class="bg-background sticky top-0">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-secondary">Hora</th>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-secondary">Tipo</th>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-secondary">Género</th>
                                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-secondary">Portero</th>
                            </tr>
                        </thead>
                        <tbody id="log-table-body" class="divide-y divide-default">
                            <!-- Logs se inyectan aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        
        const tbody = $('#log-table-body');
        if (club.log.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-secondary/70">${dict.no_data}</td></tr>`;
            return;
        }
        // Mostrar solo las últimas 50 entradas para no saturar
        club.log.slice(-50).reverse().forEach(entry => {
            const time = new Date(entry.timestamp).toLocaleTimeString(AppState.language, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const typeClass = entry.type === 'in' ? 'text-success' : 'text-danger';
            const typeText = entry.type === 'in' ? `<i class="fas fa-sign-in-alt mr-2"></i>ENTRADA` : `<i class="fas fa-sign-out-alt mr-2"></i>SALIDA`;
            const genderIcon = entry.gender === 'men' ? 'fas fa-male text-blue-500' : 'fas fa-female text-pink-500';
            tbody.innerHTML += `
                <tr class="hover:bg-background/50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm">${time}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${typeClass}">${typeText}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm"><i class="${genderIcon} mr-2"></i>${dict[`gender_${entry.gender}`]}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm opacity-70">${AppState.users[entry.portero]?.name || 'N/A'}</td>
                </tr>
            `;
        });
    }
    function renderUsersPage(container = $('#dashboard-content')) {
        const dict = translations[AppState.language];
        
        container.innerHTML = `
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold" data-lang="users_title">${dict.users_title}</h3>
                <button class="bg-primary text-white px-4 py-2 rounded-lg font-semibold hover:bg-primary/90 transition-colors duration-200">
                    <i class="fas fa-plus mr-2"></i> <span data-lang="users_add">${dict.users_add}</span>
                </button>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                ${Object.entries(AppState.users).map(([id, user]) => `
                    <div class="bg-card p-4 rounded-xl shadow border border-default flex items-center justify-between">
                        <div>
                            <p class="text-lg font-bold">${user.name}</p>
                            <p class="text-sm opacity-70">${user.role.charAt(0).toUpperCase() + user.role.slice(1)}</p>
                            ${user.club ? `<p class="text-xs opacity-50">${AppState.clubs[user.club].name}</p>` : ''}
                        </div>
                        <button class="text-danger/70 hover:text-danger p-2 rounded-full transition-colors">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `).join('')}
            </div>
            <div class="mt-8 bg-card p-6 rounded-xl shadow border border-default">
                <h3 class="text-lg font-semibold mb-3">Roles y Permisos (Mock)</h3>
                <ul class="list-disc ml-6 opacity-80 text-sm space-y-1">
                    <li><strong class="text-primary">Dueño:</strong> Acceso total, puede ver todas las comparativas.</li>
                    <li><strong class="text-blue-500">Director:</strong> Acceso a estadísticas de su local, gestión de usuarios.</li>
                    <li><strong class="text-pink-500">Portero:</strong> Solo acceso a la vista de contador, sin dashboard.</li>
                </ul>
            </div>
        `;
    }
    function renderComparisonPage(container = $('#dashboard-content')) {
        const dict = translations[AppState.language];
        const primaryColor = getComputedStyle(document.body).getPropertyValue('--color-primary').trim();
        const cardColor = getComputedStyle(document.body).getPropertyValue('--color-card').trim();
        const textColor = getComputedStyle(document.body).getPropertyValue('--color-text').trim();
        
        container.innerHTML = `
            <div class="bg-card p-6 rounded-xl shadow border border-default">
                <h3 class="text-xl font-semibold mb-4" data-lang="comparison_title">${dict.comparison_title}</h3>
                <div class="h-80">
                    <canvas id="clubComparisonChart"></canvas>
                </div>
            </div>
        `;
        const labels = Object.values(AppState.clubs).map(c => c.name);
        // Usar datos mockeados o reales si se hubieran actualizado
        const mockCounts = [150, 800, 2500]; 
        const mockMaxCapacity = [300, 1500, 4000]; 
        const ctx = $('#clubComparisonChart').getContext('2d');
        // Asegurar que el chart anterior se destruya si existe
        if (window.comparisonChart) {
            window.comparisonChart.destroy();
        }
        window.comparisonChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Aforo Actual (Mock)',
                        data: mockCounts,
                        backgroundColor: `rgba(${primaryColor}, 0.8)`,
                        borderColor: `rgb(${primaryColor})`,
                        borderWidth: 1
                    },
                    {
                        label: 'Aforo Máximo',
                        data: mockMaxCapacity,
                        backgroundColor: `rgba(100, 116, 139, 0.5)`, // Gris para el límite
                        borderColor: `rgba(100, 116, 139, 0.8)`,
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: `rgb(${textColor})`,
                            font: { family: 'Inter' }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: `rgba(${textColor}, 0.1)` },
                        ticks: { color: `rgb(${textColor})` }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: `rgb(${textColor})` }
                    }
                }
            }
        });
    }
    // --- MOCK DATA GENERATION ---
    function generateMockData() {
        if (AppState.mockDataGenerated) return;
        
        // Simular un estado inicial más realista para Murano
        AppState.clubs.murano.currentCount = 150;
        AppState.clubs.murano.menCount = 80;
        AppState.clubs.murano.womenCount = 70;
        for (let i = 0; i < 20; i++) {
            const isEntry = Math.random() > 0.4;
            const gender = Math.random() > 0.5 ? 'men' : 'women';
            AppState.clubs.murano.log.push({
                timestamp: new Date(Date.now() - (i * 3600000) - (Math.random() * 100000)), // Hace 1 a 20 horas
                type: isEntry ? 'in' : 'out',
                gender: gender,
                portero: 'portero1'
            });
        }
        
        AppState.mockDataGenerated = true;
    }
    </script>
