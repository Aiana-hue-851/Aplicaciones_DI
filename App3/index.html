    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --ios-blue: #007AFF;
            --ios-gray: #8E8E93;
            --ios-bg-light: #F2F2F7;
            --ios-bg-dark: #000000;
            --ios-card-light: #FFFFFF;
            --ios-card-dark: #1C1CE;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease;
        }

        /* iOS Scrollbar hidden */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .dark .glass {
            background: rgba(28, 28, 30, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* iOS Animations */
        .page-transition {
            animation: slideIn 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tap-active:active {
            transform: scale(0.96);
            opacity: 0.8;
            transition: transform 0.1s;
        }

        /* Checkbox iOS Toggle Style */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #34D399;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #34D399;
        }
        
        /* Hide Map attribution for cleaner UI (optional) */
        .leaflet-control-attribution { display: none; }
    </style>

        /**
         * CORE APPLICATION LOGIC
         */
        const App = {
            state: {
                lang: 'es',
                theme: 'light',
                user: null,
                currentView: 'home',
                history: [],
                mapInstance: null,
                mapMarkers: [],
                spainMapInstance: null, // NUEVO
                spainMapMarkers: [] // NUEVO
            },

            init() {
                this.loadSettings();
                this.applyTheme();
                this.renderView('home');
                this.setupListeners();
                console.log("PintoGuide iOS initialized.");
            },

            // --- State & Storage ---
            loadSettings() {
                const saved = localStorage.getItem('pinto_app_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    this.state.lang = parsed.lang || 'es';
                    this.state.theme = parsed.theme || 'light';
                    this.state.user = parsed.user || null;
                }
            },
            saveSettings() {
                localStorage.setItem('pinto_app_state', JSON.stringify({
                    lang: this.state.lang,
                    theme: this.state.theme,
                    user: this.state.user
                }));
            },

            // --- Internationalization ---
            t(key) {
                const dict = DB.i18n[this.state.lang] || DB.i18n['en'];
                return key.split('.').reduce((obj, i) => obj ? obj[i] : null, dict) || key;
            },
            
            updateLanguage(lang) {
                this.state.lang = lang;
                this.saveSettings();
                this.renderView(this.state.currentView);
                this.updateNavLabels();
            },

            updateNavLabels() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    el.innerText = this.t(el.dataset.i18n);
                });
            },

            // --- Theme ---
            toggleTheme() {
                this.state.theme = this.state.theme === 'light' ? 'dark' : 'light';
                this.applyTheme();
                this.saveSettings();
            },
            applyTheme() {
                if (this.state.theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            },

            // --- Auth ---
            login(username) {
                UI.showLoading(true);
                setTimeout(() => {
                    this.state.user = { name: username, favorites: [], itineraries: [] };
                    this.saveSettings();
                    UI.showLoading(false);
                    UI.showToast(`${App.t('auth_welcome')}, ${username}`, 'success');
                    this.renderView('profile');
                }, 1000);
            },
            logout() {
                this.state.user = null;
                this.saveSettings();
                UI.showToast(this.t('auth_logout'), 'info');
                this.renderView('profile');
            },

            // --- Navigation ---
            navigate(viewName, params = {}) {
                if (this.state.currentView === viewName && !params.force) return;
                
                // Limpiar instancia de mapa si salimos de la vista de mapa
                if (this.state.currentView === 'map' && viewName !== 'map' && this.state.mapInstance) {
                    this.state.mapInstance.remove();
                    this.state.mapInstance = null;
                }
                // --- INICIO DE MODIFICACIÓN ---
                // Limpiar instancia de mapa de España
                if (this.state.currentView === 'spain' && viewName !== 'spain' && this.state.spainMapInstance) {
                    this.state.spainMapInstance.remove();
                    this.state.spainMapInstance = null;
                }
                // --- FIN DE MODIFICACIÓN ---

                if (!params.force) { // No añadir al historial si es una recarga forzada (como en goBack)
                    this.state.history.push(this.state.currentView);
                }
                this.state.currentView = viewName;
                
                // Update Tab Active State
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    const mainViews = ['home', 'pinto', 'itineraries', 'search', 'profile'];
                    if(mainViews.includes(viewName) && btn.dataset.target === viewName) {
                        btn.classList.add('text-ios-blue');
                        btn.classList.remove('text-gray-400');
                    } else if (mainViews.includes(btn.dataset.target)) { // Solo desactiva las pestañas principales
                        btn.classList.remove('text-ios-blue');
                        btn.classList.add('text-gray-400');
                    }
                });

                // Show/Hide Back Button
                const backBtn = document.getElementById('back-btn');
                const mainViews = ['home', 'pinto', 'itineraries', 'search', 'profile'];
                if (!mainViews.includes(viewName)) {
                    backBtn.classList.remove('hidden');
                } else {
                    backBtn.classList.add('hidden');
                }

                this.renderView(viewName, params);
            },

            goBack() {
                const prev = this.state.history.pop();
                
                // Limpiar instancia de mapa si salimos de la vista de mapa
                if (this.state.currentView === 'map' && this.state.mapInstance) {
                    this.state.mapInstance.remove();
                    this.state.mapInstance = null;
                }
                // --- INICIO DE MODIFICACIÓN ---
                // Limpiar instancia de mapa de España
                if (this.state.currentView === 'spain' && this.state.spainMapInstance) {
                    this.state.spainMapInstance.remove();
                    this.state.spainMapInstance = null;
                }
                // --- FIN DE MODIFICACIÓN ---

                if (prev) {
                    this.state.currentView = prev; // Set current view ANTES de navegar
                    // Forzamos la navegación para actualizar la UI del botón de atrás y pestañas
                    this.navigate(prev, { force: true }); 
                } else {
                    this.navigate('home');
                }
            },

            // --- View Rendering Engine ---
            renderView(viewName, params = {}) {
                const container = document.getElementById('app-container');
                container.innerHTML = ''; // Clear
                
                // --- INICIO DE LA MODIFICACIÓN ---
                // Gestionar el overflow del contenedor principal
                if (viewName === 'map' || viewName === 'spain') { // MODIFICADO: Aplicar también a 'spain'
                    container.classList.remove('overflow-y-auto', 'px-4');
                    container.classList.add('overflow-hidden', 'p-4'); // Dejamos p-4 para 'spain'
                } else {
                    container.classList.add('overflow-y-auto', 'px-4');
                    container.classList.remove('overflow-hidden', 'p-0');
                }
                
                if (viewName === 'map') { // Específico para 'map'
                     container.classList.remove('p-4');
                     container.classList.add('p-0');
                }
                // --- FIN DE LA MODIFICACIÓN ---

                const wrapper = document.createElement('div');
                
                // MODIFICACIÓN: Quitar 'space-y-4' por defecto y añadirlo a cada vista
                wrapper.className = 'page-transition'; 

                let title = "Pinto Guide";

                switch(viewName) {
                    case 'home':
                        title = this.t('welcome');
                        wrapper.innerHTML = Views.home();
                        wrapper.classList.add('space-y-4'); // Añadido
                        break;
                    case 'pinto':
                        title = this.t('sections.pinto');
                        wrapper.innerHTML = Views.pinto();
                        wrapper.classList.add('space-y-4');
                        break;
                    case 'itineraries':

                        break;
                    case 'search': // ESTA ES AHORA LA NUEVA CENTRAL DE RESERVAS
                        title = this.t('nav_search');
                        wrapper.innerHTML = Views.search();
                        wrapper.classList.add('space-y-4'); // Añadido
                        break;
                    case 'profile':
                        title = this.t('nav_profile');
                        wrapper.innerHTML = Views.profile();
                        wrapper.classList.add('space-y-4'); // Añadido
                        break;
                    case 'spain':
                        title = this.t('sections.spain');
                        wrapper.innerHTML = Views.spain();
                        wrapper.classList.add('space-y-4'); // Añadido
                        // --- INICIO DE MODIFICACIÓN ---
                        // Asegurar que el wrapper tenga altura para el mapa
                        wrapper.classList.add('h-full', 'flex', 'flex-col');
                        setTimeout(() => App.initSpainMap('all'), 50); // NUEVO
                        // --- FIN DE MODIFICACIÓN ---
                        break;
                    // --- INICIO NUEVA SECCIÓN ---
                    case 'cinema':
                        title = this.t('sections.cinema');
                        wrapper.innerHTML = Views.cinema();
                        wrapper.classList.add('space-y-4'); // Añadido
                        break;
                    case 'health':
                        title = this.t('sections.health');
                        wrapper.innerHTML = Views.health();
                        wrapper.classList.add('space-y-4'); // Añadido
                        break;
                    case 'banks':
                        title = this.t('sections.banks');
                        wrapper.innerHTML = Views.banks();
                        wrapper.classList.add('space-y-4'); // Añadido
                        break;
                    case 'gastronomy':
                        title = this.t('sections.gastronomy');
                        wrapper.innerHTML = Views.gastronomy();
                        wrapper.classList.add('space-y-4'); // Añadido
                        break;
                    case 'sports':
                        title = this.t('sections.sports');
                        wrapper.innerHTML = Views.sports();
                        wrapper.classList.add('space-y-4'); // Añadido
                        break;
                    // --- FIN NUEVA SECCIÓN ---
                    case 'mobility': // --- SECCIÓN RESTAURADA ---
                        title = this.t('sections.guide_mob');
                        wrapper.innerHTML = Views.mobility();
                        wrapper.classList.add('space-y-4');
                        break;
                    case 'map':
                        title = this.t('sections.map');

                        wrapper.classList.add('h-full', 'flex', 'flex-col'); 
                        setTimeout(() => this.initMap('all'), 50); // Reducido timeout
                        break;
                    case 'hotels': // VISTA RENOMBRADA (ANTES ERA 'search')
                        title = this.t('book_tab_hotel');
                        wrapper.innerHTML = Views.hotels();
                        wrapper.classList.add('space-y-4'); // Añadido
                        break;

                        title = this.t('sections.events');

                        wrapper.classList.add('space-y-4');

                        title = this.t('prof_favs');

                        break;

                        title = this.t('prof_routes');

                        break;
                    default:
                        wrapper.innerHTML = `<div class="p-4 text-center">View not found</div>`;
                }

                document.getElementById('page-title').innerText = title;
                container.appendChild(wrapper);
            },

            // --- Features Logic ---
            initMap(filter = 'all') {
                const mapElement = document.getElementById('map');
                // Salir si el elemento del mapa no está presente
                if (!mapElement) {
                    console.warn("El elemento #map no se encontró en el DOM. Esperando...");
                    setTimeout(() => this.initMap(filter), 100); // Reintentar
                    return;
                }

                // Initialize Map if not exists
                if (!this.state.mapInstance) {
                    console.log("Creando nueva instancia de mapa");
                    this.state.mapInstance = L.map('map').setView([40.2416, -3.7005], 15);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        attribution: '',
                        maxZoom: 19
                    }).addTo(this.state.mapInstance);
                } else {
                    console.log("Refrescando tamaño de mapa");
                    // Just fix size if re-entering view
                    setTimeout(() => {
                        if (this.state.mapInstance) {
                            this.state.mapInstance.invalidateSize();
                        }
                    }, 100);
                }

                // Clear existing markers
                this.state.mapMarkers.forEach(m => this.state.mapInstance.removeLayer(m));
                this.state.mapMarkers = [];

                // Filter Places
                const placesToShow = filter === 'all' 
                    ? DB.places 
                    : DB.places.filter(p => p.category === filter);

                // Define Colors for categories
                const catColors = {
                    history: '#FF3B30', // red
                    nature: '#34C759', // green
                    hotel: '#AF52DE', // purple
                    shop: '#FF9500', // orange
                    food: '#007AFF', // blue
                    leisure: '#AC8E68' // brown
                };

                placesToShow.forEach(place => {
                    const color = catColors[place.category] || '#8E8E93'; // gray
                    
                    // Custom Circle Marker to look cleaner
                    const marker = L.circleMarker([place.lat, place.lng], {
                        radius: 8,
                        fillColor: color,
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(this.state.mapInstance);

                    marker.bindPopup(`
                        <div class="text-center w-40">
                            <img src="${place.img}" class="w-full h-20 object-cover rounded-md mb-2" onerror="this.src='https://placehold.co/160x80/f0f0f0/ccc?text=Pinto'">
                            <b class="text-sm">${place.name}</b><br>
                            <span class="text-xs text-gray-500">${place.desc}</span>
                        </div>

                    this.state.mapMarkers.push(marker);
                });

            // --- INICIO DE NUEVA FUNCIÓN ---
            // Lógica para el mensaje motivacional del input time
            updateTimeMotivation(timeValue) {
                const motivationEl = document.getElementById('time-motivation');
                if (!motivationEl) return;

                const hour = parseInt(timeValue.split(':')[0], 10);
                let message = '';
                if (hour >= 5 && hour < 12) {
                    message = App.t('time_morning');
                } else if (hour >= 12 && hour < 16) {
                    message = App.t('time_midday');
                } else if (hour >= 16 && hour < 21) {
                    message = App.t('time_afternoon');
                } else {
                    message = App.t('time_night');
                }
                motivationEl.innerText = message;
                motivationEl.classList.remove('hidden');
            },

            // Genera una ruta custom (simulado)
            generateCustomRoute() {
                // --- INICIO DE MODIFICACIÓN ---
                const routeNameInput = document.getElementById('custom-route-name');
                let typeName = routeNameInput.value;
                
                if (!typeName) {
                    UI.showToast(App.t('route_name_ph'), "error"); // Usamos el placeholder como error
                    routeNameInput.focus();
                    return;
                }
                
                // Simulación de generación
                UI.showLoading(true, App.t('itinerary_generating'));
                
                setTimeout(() => {
                    // Generar pasos aleatorios (simulación)
                    const steps = DB.routeContent.custom.steps; // Usar la simulación de DB

                    // Guardar la ruta directamente
                    this.saveGeneratedRoute(typeName, steps, {
                        closeModal: true,
                        showToast: true,
                        refreshView: true
                    });
                    
                    UI.showLoading(false);
                    
                }, 1500); // Simular tiempo de generación
                // --- FIN DE MODIFICACIÓN ---
            },

            // Guarda la ruta generada
            saveGeneratedRoute(name, steps, options = {}) {
                // --- INICIO DE MODIFICACIÓN ---
                // Configuración por defecto
                const config = {
                    closeModal: true,
                    showToast: true,
                    refreshView: true,
                    ...options
                };
                
                if (!this.state.user) {
                    UI.showToast(this.t('msg_login_req'), 'error');
                    return;
                }
                // --- FIN DE MODIFICACIÓN ---

                // Convertir steps (que es un string JSON) de nuevo a objeto
                if (typeof steps === 'string') {
                    steps = JSON.parse(steps);
                }

                const newRoute = {
                    id: Date.now(),
                    name: name, // Usamos el nombre del tipo (ej. "Familia" o "Ruta Personalizada")
                    date: new Date().toLocaleDateString(),
                    steps: steps // Guardamos los pasos
                };
                
                this.state.user.itineraries.push(newRoute);
                this.saveSettings();
                
                // --- INICIO DE MODIFICACIÓN ---
                if (config.closeModal) UI.closeModal();
                if (config.showToast) UI.showToast(`${App.t('route_saved_success')} ${name}`, 'success');
                if (config.refreshView) this.renderView('itineraries'); // Refresh
                // --- FIN DE MODIFICACIÓN ---
            },
            
            // Ver una ruta guardada
            viewSavedRoute(id) {
                if (!this.state.user) return;
                const route = this.state.user.itineraries.find(r => r.id === id);
                if (!route) return;
                
                const html = Views.buildRouteSteps(route.steps);
                UI.showModal(route.name, html);
            },

            // Borrar una ruta guardada
            deleteSavedRoute(id, btn) {
                if (!this.state.user) return;
                
                const index = this.state.user.itineraries.findIndex(r => r.id === id);
                if (index > -1) {
                    this.state.user.itineraries.splice(index, 1);
                    this.saveSettings();
                    
                    // Eliminar del DOM
                    btn.closest('.route-list-item').remove();
                    
                    UI.showToast(this.t('route_deleted_success'), 'info');
                    
                    // Comprobar si la lista está vacía
                    if (this.state.user.itineraries.length === 0) {
                        this.renderView('itineraries'); // Recargar para mostrar mensaje vacío
                    }
                }
            },
            // --- FIN DE NUEVAS FUNCIONES ---

            setupListeners() {
                // Delegate
            }

                        <h3 class="font-bold text-lg mb-3 dark:text-white">${App.t('gastro_title_local')}</h3>
                        <div class="space-y-3">
                            ${DB.restaurants.filter(r => r.type === 'local').map(r => this.restaurantCard(r)).join('')}
                        </div>
                    </div>
                `;
            },
            
            // --- INICIO DE MODIFICACIÓN ---
            getPriceText(priceSymbol) {
                switch(priceSymbol) {
                    case '€€€€': return App.t('price_expensive');
                    case '€€€': return App.t('price_normal');
                    case '€€': return App.t('price_cheap');
                    default: return priceSymbol;
                }
            },
            
            restaurantCard(r) {
                const priceText = this.getPriceText(r.price); // Usar la nueva función
                return `
                    <div class="bg-white dark:bg-ios-card p-4 rounded-xl shadow-sm flex items-center justify-between gap-4">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold dark:text-white truncate">${r.name}</h4>
                            <p class="text-sm text-gray-500">${r.location} - <span class="font-medium">${priceText}</span></p>
                        </div>
                        <button onclick="App.showRestaurantDetails(${r.id})" class="bg-gray-100 dark:bg-gray-700 text-xs px-3 py-2 rounded-lg font-medium dark:text-white tap-active flex-shrink-0">${App.t('view_btn')}</button>
                    </div>
                `;
            },
            // --- FIN DE MODIFICACIÓN ---

            sports() {
                return `
                    <div>
                        <h3 class="font-bold text-lg mb-3 dark:text-white">${App.t('sports_title')}</h3>
                        <div class="space-y-4">
                            ${DB.gyms.map(g => `
                                <div class="bg-white dark:bg-ios-card rounded-xl p-4 shadow-sm">
                                    <div class="flex justify-between items-center mb-2">
                                        <h4 class="font-bold dark:text-white">${g.name}</h4>
                                        <span class="text-blue-500 font-bold text-sm">${g.price}</span>
                                    </div>
                                    <p class="text-xs text-gray-500"><span class="font-semibold">${App.t('hours_title')}:</span> ${g.hours}</p>
                                    <p class="text-xs text-gray-500"><span class="font-semibold"></span> ${g.location}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },
            // --- FIN NUEVAS VISTAS ---

            // --- VISTA RESTAURADA ---
            mobility() {
                 return `
                    <!-- Tarifas Abono -->
                    <div>
                        <h3 class="font-bold text-lg mb-3 dark:text-white">${App.t('mob_fares_title')}</h3>
                        <div class="bg-white dark:bg-ios-card rounded-xl p-4 shadow-sm space-y-3">
                            ${this.mobilityInfoItem(App.t('mob_fare_young'), '20,00€ (Todas las zonas)', 'fa-child')}
                            ${this.mobilityInfoItem(App.t('mob_fare_normal'), 'Desde 54,60€ (A) hasta 131,80€ (E2)', 'fa-user')}
                            ${this.mobilityInfoItem(App.t('mob_fare_senior'), 'Gratuito (Tarjeta > 65)', 'fa-person-cane')}
                        </div>
                    </div>

                    <!-- Zonas -->
                    <div>
                        <h3 class="font-bold text-lg mb-3 dark:text-white">${App.t('mob_zones_title')}</h3>
                        <div class="bg-white dark:bg-ios-card rounded-xl p-4 shadow-sm">
                            <p class="text-sm text-gray-600 dark:text-gray-300">${App.t('mob_zones_desc')}</p>
                            <div class="flex justify-around mt-4">
                                <span class="font-bold text-xs bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded">A</span>
                                <span class="font-bold text-xs bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded">B1</span>
                                <span class="font-bold text-xs bg-blue-500 text-white px-2 py-1 rounded">B2</span>
                                <span class="font-bold text-xs bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded">B3</span>
                                <span class="font-bold text-xs bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded">C1</span>
                                <span class="font-bold text-xs bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded">C2</span>
                            </div>
                        </div>
                    </div>

                    <!-- Mapas -->
                    <div>
                        <h3 class="font-bold text-lg mb-3 dark:text-white">${App.t('mob_map_title')}</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white dark:bg-ios-card rounded-xl p-4 shadow-sm text-center">
                                <div class="h-32 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg flex items-center justify-center mb-2">
                                    <span classs="text-xs text-gray-400">${App.t('mob_placeholder_desc')}</span>
                                </div>
                                <span class="font-semibold text-sm dark:text-white">${App.t('mob_map_renfe')}</span>
                            </div>
                            <div class="bg-white dark:bg-ios-card rounded-xl p-4 shadow-sm text-center">
                                <div class="h-32 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg flex items-center justify-center mb-2">
                                    <span class="text-xs text-gray-400">${App.t('mob_placeholder_desc')}</span>
                                </div>
                                <span class="font-semibold text-sm dark:text-white">${App.t('mob_map_metro')}</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Horarios -->
                    <div>
                        <h3 class="font-bold text-lg mb-3 dark:text-white">${App.t('mob_schedule_title')}</h3>
                        <div class="grid gap-4">
                            <button onclick="UI.showModal(App.t('mob_schedule_train'), \`
                                <h4 class='font-bold text-lg dark:text-white mb-2'>\${App.t('schedule_train_title')}</h4>
                                <p class='text-sm text-gray-500 mb-4'>\${App.t('schedule_train_dir_1')}</p>
                                <ul class='space-y-2'>
                                  <li class='flex justify-between p-2 bg-gray-50 dark:bg-gray-700 rounded-lg'><span>06:15</span> <span>06:30</span> <span>06:45</span></li>
                                  <li class='flex justify-between p-2 bg-gray-50 dark:bg-gray-700 rounded-lg'><span>07:00</span> <span>07:15</span> <span>07:30</span></li>
                                  <li class='text-center text-xs text-gray-400 mt-2'>\${App.t('schedule_every_20')}</li>
                                </ul>\`);" 
                                class="w-full bg-white dark:bg-ios-card p-4 rounded-xl flex items-center justify-between tap-active shadow-sm">
                                <span class="font-medium dark:text-white">${App.t('mob_schedule_train')}</span>
                                <i class="fa-solid fa-chevron-right text-gray-400"></i>
                            </button>
                            <button onclick="UI.showModal(App.t('mob_schedule_bus'), \`
                                <h4 class='font-bold text-lg dark:text-white mb-2'>\${App.t('schedule_bus_title')}</h4>
                                <p class='text-sm text-gray-500 mb-4'>\${App.t('schedule_bus_dir_1')}</p>
                                <ul class='space-y-2'>
                                  <li class='flex justify-between p-2 bg-gray-50 dark:bg-gray-700 rounded-lg'><span>07:00</span> <span>07:20</span> <span>07:40</span></li>
                                  <li class='flex justify-between p-2 bg-gray-50 dark:bg-gray-700 rounded-lg'><span>08:00</span> <span>08:20</span> <span>08:40</span></li>
                                  <li class='text-center text-xs text-gray-400 mt-2'>\${App.t('schedule_every_20')}</li>
                                </ul>\`);" 
                                class="w-full bg-white dark:bg-ios-card p-4 rounded-xl flex items-center justify-between tap-active shadow-sm">
                                <span class="font-medium dark:text-white">${App.t('mob_schedule_bus')}</span>
                                <i class="fa-solid fa-chevron-right text-gray-400"></i>
                            </button>
                        </div>
                    </div>
                `;
            },
            
            // Helper para la vista de movilidad
            mobilityInfoItem(title, text, icon) {
                return `
                    <div class="flex items-center gap-3 border-b border-gray-100 dark:border-gray-700 pb-3 last:border-b-0">
                        <i class="fa-solid ${icon} text-blue-500 w-5 text-center"></i>
                        <div>
                            <p class="font-semibold text-sm dark:text-white">${title}</p>
                            <p class="text-xs text-gray-500">${text}</p>
                        </div>
                    </div>
                `;
            },
            // --- FIN VISTA RESTAURADA ---

            profile() {
                if (!App.state.user) {
                    return `
                        <div class="flex flex-col items-center justify-center h-[60vh] text-center">
                            <div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center mb-6">
                                <i class="fa-solid fa-user text-4xl text-gray-400"></i>
                            </div>
                            <h2 class="text-2xl font-bold mb-2 dark:text-white">${App.t('auth_welcome')}</h2>
                            <p class="text-gray-500 mb-8 px-8">${App.t('auth_subtitle')}</p>
                            
                            <form onsubmit="event.preventDefault(); App.login(this.username.value)" class="w-full max-w-xs space-y-4">
                                <input type="text" name="username" placeholder="${App.t('auth_placeholder')}" required class="w-full h-12 px-4 rounded-xl bg-white dark:bg-ios-card border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-ios-blue dark:text-white">
                                <input type="password" name="password" placeholder="${App.t('auth_password')}" required class="w-full h-12 px-4 rounded-xl bg-white dark:bg-ios-card border border-gray-200 dark:border-gray-700 focus:outline-none focus:border-ios-blue dark:text-white">
                                <button type="submit" class="w-full h-12 bg-ios-blue text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30 tap-active">
                                    ${App.t('auth_login')}
                                </button>
                            </form>
                            ${this.settingsList()}
                        </div>
                    `;
                }

                return `
                     <div class="flex items-center gap-4 mb-8 pt-4">
                        <div class="w-20 h-20 bg-gradient-to-r from-blue-400 to-purple-500 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow-lg">
                            ${App.state.user.name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold dark:text-white">${App.state.user.name}</h2>
                            <p class="text-gray-500 text-sm">${App.t('auth_expert')}</p>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-ios-card rounded-xl overflow-hidden mb-6">
                         <div onclick="App.navigate('favs_list')" class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-gray-700 tap-active cursor-pointer">
                            <span class="flex items-center gap-3 dark:text-white"><i class="fa-solid fa-heart text-red-500 w-6"></i> ${App.t('prof_favs')}</span>
                            <span class="text-gray-400 text-sm">${App.state.user.favorites.length} <i class="fa-solid fa-chevron-right ml-2"></i></span>
                        </div>
                         <div onclick="App.navigate('routes_list')" class="flex justify-between items-center p-4 tap-active cursor-pointer">
                            <span class="flex items-center gap-3 dark:text-white"><i class="fa-solid fa-map text-green-500 w-6"></i> ${App.t('prof_routes')}</span>
                            <i class="fa-solid fa-chevron-right text-gray-400 text-sm"></i>
                        </div>
                    </div>

                    ${this.settingsList()}

                    <button onclick="App.logout()" class="w-full py-4 text-red-500 font-medium bg-white dark:bg-ios-card rounded-xl mt-4 tap-active">
                        ${App.t('auth_logout')}
                    </button>
                `;
            },

            favoritesList() {
                if (!App.state.user || App.state.user.favorites.length === 0) {
                    return `<div class="p-8 text-center text-gray-400">${App.t('favs_empty')}</div>`;
                }
                // Filter DB places by favorite IDs
                const favPlaces = DB.places.filter(p => App.state.user.favorites.includes(p.id));
                
                return `
                    <div class="space-y-4">
                        ${favPlaces.map(p => `
                            <div class="bg-white dark:bg-ios-card rounded-xl overflow-hidden flex h-24">
                                <img src="${p.img}" class="w-24 h-full object-cover" onerror="this.src='https::/placehold.co/96x96/f0f0f0/ccc?text=Pinto'">
                                <div class="p-3 flex-1 flex flex-col justify-center">
                                    <h4 class="font-bold dark:text-white">${p.name}</h4>
                                    <p class="text-xs text-gray-500 line-clamp-1">${p.desc}</p>
                                </div>
                                <button onclick="App.toggleFavorite(${p.id}, this); this.closest('div').remove()" class="px-4 text-red-500">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            routesList() {
                if (!App.state.user || App.state.user.itineraries.length === 0) {
                    return `<div class="p-8 text-center text-gray-400">${App.t('routes_user_empty')}</div>`;
                }
                
                return `
                    <div class="space-y-3">
                         ${App.state.user.itineraries.map(r => `
                            <div class="route-list-item p-4 bg-white dark:bg-ios-card rounded-xl flex justify-between items-center shadow-sm">
                                <div>
                                    <span class="block font-bold dark:text-white">${r.name}</span>
                                    <span class="text-xs text-gray-500">${r.date}</span>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="App.viewSavedRoute(${r.id})" class="w-10 h-10 flex items-center justify-center bg-blue-100 dark:bg-blue-900 text-ios-blue rounded-lg tap-active" aria-label="${App.t('view_btn')}">
                                        <i class="fa-solid fa-eye"></i>
                                    </button>
                                    <button onclick="App.deleteSavedRoute(${r.id}, this)" class="w-10 h-10 flex items-center justify-center bg-red-100 dark:bg-red-900 text-ios-red rounded-lg tap-active" aria-label="${App.t('delete_btn')}">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            settingsList() {
                return `
                    <div class="bg-white dark:bg-ios-card rounded-xl overflow-hidden mt-6">
                        <!-- Language -->
                        <div class="p-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                            <span class="flex items-center gap-3 dark:text-white"><i class="fa-solid fa-globe text-blue-500 w-6"></i> ${App.t('prof_lang')}</span>
                            <select onchange="App.updateLanguage(this.value)" class="bg-transparent text-right text-ios-blue outline-none">
                                ${Object.entries(DB.languages).map(([k, v]) => `<option value="${k}" ${App.state.lang === k ? 'selected' : ''}>${v}</option>`).join('')}
                            </select>
                        </div>
                        <!-- Dark Mode -->
                        <div class="p-4 flex justify-between items-center">
                            <span class="flex items-center gap-3 dark:text-white"><i class="fa-solid fa-moon text-purple-500 w-6"></i> ${App.t('prof_dark')}</span>
                            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" name="toggle" id="toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" ${App.state.theme === 'dark' ? 'checked' : ''} onclick="App.toggleTheme()"/>
                                <label for="toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                        </div>
                    </div>
                `;
            },

            cardBig(title, icon, color, action) {
                return `
                    <div onclick="${action}" class="bg-white dark:bg-ios-card p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 h-32 tap-active cursor-pointer">
                        <div class="${color} w-10 h-10 rounded-full flex items-center justify-center text-white text-lg shadow-md mb-1">
                            <i class="fa-solid ${icon}"></i>
                        </div>
                        <span class="font-semibold text-sm dark:text-white text-center leading-tight">${title}</span>
                    </div>
                `;
            }
        };

        /**
         * UI UTILS
         */
        const UI = {
            showModal(title, contentHTML) {
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                content.innerHTML = `
                    <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-4"></div>
                    <h3 id="modal-title-text" class="text-xl font-bold mb-4 text-center dark:text-white">${title}</h3>
                    <div id="modal-body-content" class="text-gray-600 dark:text-gray-300">${contentHTML}</div>
                    <button onclick="UI.closeModal()" class="mt-6 w-full bg-gray-100 dark:bg-gray-700 py-3 rounded-xl font-semibold text-sm dark:text-white">Cerrar</button>
                `;

                overlay.classList.remove('hidden');
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    content.classList.remove('translate-y-full');
                    content.classList.add('sm:translate-y-0');
                }, 10);
            },

            updateModalContent(title, contentHTML) {
                const titleEl = document.getElementById('modal-title-text');
                const bodyEl = document.getElementById('modal-body-content');
                if(titleEl) titleEl.innerText = title;
                if(bodyEl) {
                    bodyEl.innerHTML = contentHTML;
                    // Eliminar el botón "Cerrar" por defecto si hay botones nuevos
                    const defaultCloseBtn = bodyEl.nextElementSibling;
                    if (defaultCloseBtn && defaultCloseBtn.tagName === 'BUTTON' && (defaultCloseBtn.innerText.toLowerCase() === 'cerrar' || defaultCloseBtn.innerText.toLowerCase() === 'close')) {
                        defaultCloseBtn.style.display = 'none';
                    }
                }
            },

            openPaymentModal(item, price) {
                const html = `
                    <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-xl mb-4 flex justify-between items-center">
                        <span class="font-medium dark:text-white">${item}</span>
                        <span class="font-bold text-ios-blue">${price}</span>
                    </div>
                    <p class="text-xs text-gray-400 mb-4 uppercase font-bold tracking-wide">${App.t('pay_method')}</p>
                    
                    <div class="space-y-3">
                        <button onclick="App.processPayment('card')" class="w-full flex items-center gap-3 p-3 border border-gray-200 dark:border-gray-600 rounded-xl tap-active">
                            <i class="fa-regular fa-credit-card text-xl text-blue-500"></i> <span class="font-medium dark:text-white">${App.t('pay_card')}</span>
                        </button>
                        <button onclick="App.processPayment('bizum')" class="w-full flex items-center gap-3 p-3 border border-gray-200 dark:border-gray-600 rounded-xl tap-active">
                            <i class="fa-solid fa-mobile-screen text-xl text-orange-500"></i> <span class="font-medium dark:text-white">${App.t('pay_bizum')}</span>
                        </button>
                         <button onclick="App.processPayment('cash')" class="w-full flex items-center gap-3 p-3 border border-gray-200 dark:border-gray-600 rounded-xl tap-active">
                            <i class="fa-solid fa-money-bill text-xl text-green-500"></i> <span class="font-medium dark:text-white">${App.t('pay_cash')}</span>
                        </button>
                    </div>
                `;
                this.showModal(App.t('pay_modal_title'), html);
            },

            closeModal() {
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                overlay.classList.add('opacity-0');
                content.classList.add('translate-y-full');
                
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 300);
            },

            showToast(msg, type = 'success') {
                const toast = document.getElementById('toast');
                const icon = document.getElementById('toast-icon');
                const text = document.getElementById('toast-message');

                text.innerText = msg;
                
                if(type === 'error') {
                    icon.className = 'fa-solid fa-circle-exclamation text-red-500 text-xl';
                } else if(type === 'info') {
                    icon.className = 'fa-solid fa-info-circle text-blue-500 text-xl';
                } else {
                    icon.className = 'fa-solid fa-circle-check text-green-500 text-xl';
                }

                toast.classList.remove('-translate-y-24', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('-translate-y-24', 'opacity-0');
                }, 3000);
            },

            showLoading(isLoading, text = "Cargando...") {
                const container = document.getElementById('app-container');
                if(isLoading) {
                    const loader = document.createElement('div');
                    loader.id = 'global-loader';
                    loader.className = 'absolute inset-0 bg-white/80 dark:bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center z-40';
                    loader.innerHTML = `
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-ios-blue mb-3"></div>
                        <span class="text-sm font-medium text-gray-500 animate-pulse">${text}</span>
                    `;
                    container.appendChild(loader);
                } else {
                    const loader = document.getElementById('global-loader');
                    if(loader) loader.remove();
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });

    </script>
</body>
</html>
