<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons (Used instead of SVG in React) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --color-focus: #3b82f6; /* Blue 500 */
            --color-short-break: #10b981; /* Green 500 */
            --color-long-break: #9333ea; /* Purple 600 */
        }
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        /* Custom styles for the circular progress bar */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .bg-animated {
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200">
    <!-- Main App Container -->
    <div id="app" class="min-h-screen flex flex-col items-center p-4">
        <!-- Header will be injected here -->
        <header id="header" class="w-full max-w-4xl flex justify-between items-center py-4"></header>
        
        <!-- Tab Navigation will be injected here -->
        <nav id="tab-nav" class="w-full max-w-lg mb-8"></nav>
        <!-- Main Content (Timer, Tasks, Profile, etc.) -->
        <main id="main-content" class="w-full max-w-lg flex-grow"></main>
    </div>
    <!-- Notification Container -->
    <div id="notification-container" class="fixed top-4 right-4 z-50 space-y-3"></div>
    <!-- Modals Container -->
    <div id="modals-container">
        <!-- Confirmation Modal -->
    </div>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, collection, query, where, getDocs, addDoc, updateDoc, deleteDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        // Global Firebase variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // Expose Firebase services to global scope for use in the main script block
        window.firebase = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, onSnapshot, setDoc, collection, query, where, getDocs, addDoc, updateDoc, deleteDoc, setLogLevel
        };
        window.firebaseConfig = firebaseConfig;
        window.initialAuthToken = initialAuthToken;
        window.appId = appId;
    </script>
    <!-- Main Application Logic (JavaScript) -->
    <script>
        const translations = {
            es: {
                header: { title: "Focus Flow" },
                tabs: { timer: "Temporizador", stats: "Estadísticas", settings: "Ajustes", profile: "Perfil" },
                theme: { toggle: "Cambiar tema" },
                timer: { focus: "Enfoque", shortBreak: "Descanso Corto", longBreak: "Descanso Largo", start: "Iniciar", pause: "Pausar", currentTask: "Tarea actual:", noTask: "Ninguna tarea seleccionada", session: "Sesión" },
                tasks: { title: "Tareas Pendientes", placeholder: "Añadir una nueva tarea...", groupStudyPromptTitle: "¿Quieres estudiar en grupo?", groupStudyPromptBody: "Ve a la pestaña <strong>Perfil</strong> para iniciar sesión y crear salas de estudio.", selectedTask: "Tarea seleccionada", selectTask: "Seleccionar tarea" },
                confirm: { title: "Confirmar Eliminación", message: "¿Estás seguro de que quieres eliminar esta tarea?", confirm: "Eliminar", cancel: "Cancelar" },
                profile: { welcome: "Bienvenido", welcomeBody: "Inicia sesión para sincronizar tu progreso y personalizar tu experiencia.", login: "Iniciar Sesión", emailPlaceholder: "tu.correo@google.com", logout: "Cerrar Sesión", notifications: "Notificaciones", notif_vibration: "Vibración", notif_sound: "Sonido", notif_snooze: "Snooze (posponer)", focusAnimation: "Animación de Enfoque", breakAnimation: "Animación de Descanso", anim_forest: "Bosque", anim_rain: "Lluvia", anim_fire: "Chimenea", anim_waves: "Olas", anim_clouds: "Nubes", anim_zen: "Jardín Zen", language: "Idioma" },
                notifications: { sessionEnded: "¡Tiempo Terminado!", sessionCompleteTitle: "¡Sesión Completada!", sessionCompleteBody: "¡Gran trabajo! Tómate un merecido descanso.", breakOverTitle: "¡Descanso terminado!", breakOverBody: "Es hora de volver a concentrarse.", taskDeleted: "La tarea ha sido eliminada con éxito.", taskDone: "¡Una tarea menos vamosss!", settingsSaved: "Ajustes del temporizador actualizados.", loggedIn: "¡Sesión Iniciada!", loggedOut: "Sesión Cerrada" },
                celebrations: { unstoppable: "¡IMPARABLE!", recharged: "¡RECARGADO!" }
            },
            // Simplified English translations for fallback
            en: {
                header: { title: "Focus Flow" },
                tabs: { timer: "Timer", stats: "Statistics", settings: "Settings", profile: "Profile" },
                theme: { toggle: "Toggle theme" },
                timer: { focus: "Focus", shortBreak: "Short Break", longBreak: "Long Break", start: "Start", pause: "Pause", currentTask: "Current task:", noTask: "No task selected", session: "Session" },
                tasks: { title: "To-Do List", placeholder: "Add a new task...", selectedTask: "Task selected", selectTask: "Select task" },
                confirm: { title: "Confirm Deletion", message: "Are you sure you want to delete this task?", confirm: "Delete", cancel: "Cancel" },
                profile: { welcome: "Welcome", welcomeBody: "Log in to sync your progress.", login: "Log In", emailPlaceholder: "your.email@google.com", logout: "Log Out", notifications: "Notifications", notif_vibration: "Vibration", notif_sound: "Sound", notif_snooze: "Snooze", focusAnimation: "Focus Animation", breakAnimation: "Break Animation", anim_forest: "Forest", anim_rain: "Rain", anim_fire: "Fireplace", anim_waves: "Waves", anim_clouds: "Clouds", anim_zen: "Zen Garden", language: "Language" },
                notifications: { sessionEnded: "Time's Up!", sessionCompleteTitle: "Session Complete!", sessionCompleteBody: "Great work! Take a well-deserved break.", breakOverTitle: "Break's over!", breakOverBody: "Time to get back to focus.", taskDeleted: "Task deleted.", taskDone: "One less task, let's go!", settingsSaved: "Timer settings updated.", loggedIn: "Logged In!", loggedOut: "Logged Out" },
                celebrations: { unstoppable: "UNSTOPPABLE!", recharged: "RECHARGED!" }
            }
        };
        const backgroundImages = {
            focus: {
                forest: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1170&q=80',
                rain: 'https://images.unsplash.com/photo-1515694346937-94d85e41e682?auto=format&fit=crop&w=687&q=80',
                fire: 'https://images.unsplash.com/photo-1549402517-5401fd69b35b?auto=format&fit=crop&w=1170&q=80'
            },
            break: {
                waves: 'https://images.unsplash.com/photo-1518364538800-65f6521435e0?auto=format&fit=crop&w=1170&q=80',
                clouds: 'https://images.unsplash.com/photo-1499346030926-9a72daac6c63?auto=format&fit=crop&w=1170&q=80',
                zen: 'https://images.unsplash.com/photo-1540317580384-e5d43616b9aa?auto=format&fit=crop&w=1170&q=80'
            }
        };
        // --- GLOBAL STATE ---
        const getInitialSettings = () => {
            try {
                const storedSettings = localStorage.getItem('focusFlowSettings');
                return storedSettings ? JSON.parse(storedSettings) : {
                    language: 'es',
                    isDark: false,
                    pomodoro: { focusDuration: 25, shortBreakDuration: 5, longBreakDuration: 15, sessionsBeforeLongBreak: 4 },
                    notifications: { vibration: true, sound: true, snooze: false },
                    animations: { focus: 'forest', break: 'waves' },
                };
            } catch (e) {
                console.error("Could not load settings from localStorage", e);
                return {
                    language: 'es', isDark: false, pomodoro: { focusDuration: 25, shortBreakDuration: 5, longBreakDuration: 15, sessionsBeforeLongBreak: 4 },
                    notifications: { vibration: true, sound: true, snooze: false }, animations: { focus: 'forest', break: 'waves' }
                };
            }
        };
        const state = {
            // Auth State
            user: null,
            isAuthReady: false,
            // App State
            currentTab: 'timer',
            settings: getInitialSettings(),
            notification: null,
            // Timer State
            mode: 'focus', // 'focus', 'shortBreak', 'longBreak'
            isActive: false,
            timeLeft: 0,
            sessionsCompleted: 0,
            intervalId: null,
            // Task State
            tasks: JSON.parse(localStorage.getItem('focusFlowTasks')) || [
                { id: crypto.randomUUID(), text: 'Desarrollar la aplicación Focus Flow', completed: false },
                { id: crypto.randomUUID(), text: 'Preparar la presentación del proyecto', completed: false },
            ],
            associatedTask: null,
            // Modal State
            isConfirmModalOpen: false,
            confirmAction: null,
            confirmMessage: '',
            confirmTitle: '',
            confirmText: '',
            cancelText: '',
        };
        // --- STATE MANAGEMENT & PERSISTENCE ---
        const saveSettings = () => {
            localStorage.setItem('focusFlowSettings', JSON.stringify(state.settings));
            applyTheme();
        };
        const saveTasks = () => {
            localStorage.setItem('focusFlowTasks', JSON.stringify(state.tasks));
        };
        const updateState = (newState) => {
            Object.assign(state, newState);
            if (newState.settings) saveSettings();
            if (newState.tasks) saveTasks();
            renderApp();
        };
        // --- UTILITY FUNCTIONS (Translation, Theme, Time) ---
        // RENAMED 't' TO 'tr' TO AVOID THE SYNTAX ERROR
        const tr = (key, options = {}) => {
            const lang = state.settings.language || 'es';
            let text = key.split('.').reduce((obj, k) => obj && obj[k], translations[lang]);
            if (!text) {
                // Fallback to Spanish if translation is missing
                text = key.split('.').reduce((obj, k) => obj && obj[k], translations['es']);
            }
            if (text && typeof text === 'string') {
                Object.keys(options).forEach(k => {
                    text = text.replace(new RegExp(`{{${k}}}`, 'g'), options[k]);
                });
            }
            return text || key;
        };
        const formatTime = (totalSeconds) => {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        };
        const applyTheme = () => {
            if (state.settings.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        };
        const setNotification = (title, message, type = 'info', duration = 3000) => {
            const container = document.getElementById('notification-container');
            if (!container) return;
            const iconMap = {
                success: 'check-circle', info: 'info', warning: 'alert-triangle', error: 'alert-circle'
            };
            const colorMap = {
                success: 'bg-green-500', info: 'bg-blue-500', warning: 'bg-yellow-500', error: 'bg-red-500'
            };
            const notificationEl = document.createElement('div');
            notificationEl.className = `${colorMap[type]} text-white p-4 rounded-xl shadow-lg flex items-center space-x-3 transition-all transform duration-300`;
            notificationEl.innerHTML = `
                <i data-lucide="${iconMap[type]}" class="w-6 h-6"></i>
                <div>
                    <h4 class="font-bold">${title}</h4>
                    <p class="text-sm">${message}</p>
                </div>
            `;
            container.appendChild(notificationEl);
            lucide.createIcons(); // Render the Lucide icon
            setTimeout(() => {
                notificationEl.classList.add('opacity-0');
                notificationEl.addEventListener('transitionend', () => notificationEl.remove());
            }, duration);
        };
        const triggerCelebration = (text) => {
            const container = document.getElementById('app');
            const celebrationEl = document.createElement('div');
            celebrationEl.className = 'fixed inset-0 flex items-center justify-center pointer-events-none z-50';
            celebrationEl.innerHTML = `
                <h1 class="text-6xl font-extrabold text-white text-shadow-lg opacity-0 animate-pulse transition-all duration-1000" style="text-shadow: 0 0 10px rgba(0,0,0,0.5);">
                    ${text}
                </h1>
            `;
            container.appendChild(celebrationEl);
            // Simple animation
            setTimeout(() => {
                const h1 = celebrationEl.querySelector('h1');
                h1.classList.remove('opacity-0');
                h1.classList.add('scale-150');
            }, 10);
            setTimeout(() => {
                celebrationEl.remove();
            }, 3000);
        };

        // --- FIREBASE AND AUTH SETUP ---
        let db, auth;
        window.initFirebaseAndAuth = async () => {
            if (!window.firebaseConfig) {
                console.warn("Firebase configuration not found. Running in mock mode.");
                updateState({ isAuthReady: true });
                return;
            }
            try {
                const { initializeApp, getAuth, signInWithCustomToken, signInAnonymously, getFirestore, onAuthStateChanged, setLogLevel } = window.firebase;
                
                // setLogLevel('debug'); // Uncomment for debugging
                const app = initializeApp(window.firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                onAuthStateChanged(auth, (user) => {
                    updateState({ user: user, isAuthReady: true });
                });
                if (window.initialAuthToken) {
                    await signInWithCustomToken(auth, window.initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Firebase initialization or authentication error:", error);
                updateState({ isAuthReady: true });
            }
        };
        // --- TIMER LOGIC ---
        const getDuration = () => {
            const { focusDuration, shortBreakDuration, longBreakDuration, sessionsBeforeLongBreak } = state.settings.pomodoro;
            switch (state.mode) {
                case 'focus': return focusDuration * 60;
                case 'shortBreak': return shortBreakDuration * 60;
                case 'longBreak': return longBreakDuration * 60;
                default: return focusDuration * 60;
            }
        };
        const handleSessionEnd = () => {
            clearInterval(state.intervalId);
            state.intervalId = null;
            document.title = tr('notifications.sessionEnded');
            setTimeout(() => document.title = tr('header.title'), 3000);
            let newMode;
            let newSessionsCompleted = state.sessionsCompleted;
            let title, message, type;
            if (state.mode === 'focus') {
                newSessionsCompleted++;
                title = tr('notifications.sessionCompleteTitle');
                message = tr('notifications.sessionCompleteBody');
                type = "success";
                triggerCelebration(tr('celebrations.unstoppable'));
                const { sessionsBeforeLongBreak } = state.settings.pomodoro;
                newMode = (newSessionsCompleted % sessionsBeforeLongBreak === 0) ? 'longBreak' : 'shortBreak';
            } else {
                title = tr('notifications.breakOverTitle');
                message = tr('notifications.breakOverBody');
                type = "info";
                triggerCelebration(tr('celebrations.recharged'));
                newMode = 'focus';
            }
            updateState({
                isActive: false,
                sessionsCompleted: newSessionsCompleted,
                mode: newMode,
            });
            updateState({ timeLeft: getDuration() });
            setNotification(title, message, type);
        };
        const tick = () => {
            updateState({ timeLeft: state.timeLeft - 1 });
            if (state.timeLeft <= 1) {
                handleSessionEnd();
            } else {
                renderTimer(); // Only re-render the timer display for performance
            }
        };
        const startTimer = () => {
            if (state.intervalId) return;
            const intervalId = setInterval(tick, 1000);
            updateState({ isActive: true, intervalId: intervalId });
        };
        const pauseTimer = () => {
            clearInterval(state.intervalId);
            updateState({ isActive: false, intervalId: null });
        };
        window.toggleTimer = () => state.isActive ? pauseTimer() : startTimer();
        window.resetTimer = () => {
            pauseTimer();
            updateState({ timeLeft: getDuration() });
            renderTimer();
        };
        window.skipSession = () => handleSessionEnd();
        window.setTimerMode = (newMode) => {
            pauseTimer();
            updateState({ mode: newMode });
            updateState({ timeLeft: getDuration() });
        };
        // --- TASK LOGIC ---
        window.handleAddTask = (e) => {
            e.preventDefault();
            const input = document.getElementById('new-task-input');
            const text = input.value.trim();
            if (text) {
                const newTask = { id: crypto.randomUUID(), text, completed: false };
                updateState({ tasks: [...state.tasks, newTask] });
                input.value = '';
                renderTasks();
            }
        };
        window.toggleTask = (id) => {
            const task = state.tasks.find(t => t.id === id);
            if (task && !task.completed) {
                setNotification(tr('notifications.taskDone'), task.text, 'success');
                triggerCelebration(tr('celebrations.unstoppable'));
            }
            const updatedTasks = state.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            updateState({ tasks: updatedTasks });
        };
        window.associateTask = (id) => {
            if (state.associatedTask?.id === id) {
                updateState({ associatedTask: null });
            } else {
                const task = state.tasks.find(t => t.id === id);
                updateState({ associatedTask: task });
            }
            renderTasks();
            renderTimer();
        };
        window.requestDeleteTask = (id) => {
            const task = state.tasks.find(t => t.id === id);
            if (state.associatedTask?.id === id) {
                updateState({ associatedTask: null });
                renderTimer();
            }
            updateState({
                isConfirmModalOpen: true,
                confirmAction: () => {
                    const updatedTasks = state.tasks.filter(t => t.id !== id);
                    updateState({ tasks: updatedTasks, isConfirmModalOpen: false });
                    setNotification(tr('notifications.taskDeleted'), task.text, 'success');
                },
                confirmTitle: tr('confirm.title'),
                confirmMessage: tr('confirm.message'),
                confirmText: tr('confirm.confirm'),
                cancelText: tr('confirm.cancel'),
            });
            renderModals();
        };
        // --- SETTINGS LOGIC ---
        window.handleSettingsChange = (e) => {
            const { name, value, type, checked } = e.target;
            const keys = name.split('.');
            let current = state.settings;
            for (let i = 0; i < keys.length - 1; i++) {
                if (!current[keys[i]]) current[keys[i]] = {};
                current = current[keys[i]];
            }
            if (type === 'checkbox') {
                current[keys[keys.length - 1]] = checked;
            } else if (type === 'number') {
                current[keys[keys.length - 1]] = parseInt(value, 10);
            } else {
                current[keys[keys.length - 1]] = value;
            }
            updateState({ settings: { ...state.settings } });
            setNotification(tr('notifications.settingsSaved'), '', 'info');
            if (keys[0] === 'pomodoro') {
                 // Re-calculate time if pomodoro settings change and timer is off
                if (!state.isActive) {
                    updateState({ timeLeft: getDuration() });
                }
            }
        };
        // --- RENDER FUNCTIONS ---
        const renderHeader = () => {
            const headerEl = document.getElementById('header');
            headerEl.innerHTML = `
                <h1 class="text-2xl font-bold">${tr('header.title')}</h1>
                <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <i data-lucide="${state.settings.isDark ? 'sun' : 'moon'}" class="w-6 h-6"></i>
                </button>
            `;
            lucide.createIcons();
        };
        window.toggleDarkMode = () => {
            const newSettings = { ...state.settings, isDark: !state.settings.isDark };
            updateState({ settings: newSettings });
        };

        const renderNav = () => {
            const navEl = document.getElementById('tab-nav');
            const tabs = [
                { id: 'timer', icon: 'clock', label: tr('tabs.timer') },
                { id: 'tasks', icon: 'list-checks', label: tr('tasks.title') },
                { id: 'settings', icon: 'settings', label: tr('tabs.settings') },
                { id: 'profile', icon: 'user', label: tr('tabs.profile') },
            ];
            navEl.innerHTML = `
                <div class="flex justify-around bg-white dark:bg-gray-800 p-2 rounded-full shadow-lg">
                    ${tabs.map(tab => `
                        <button onclick="updateState({ currentTab: '${tab.id}' })"
                            class="flex flex-col items-center p-2 rounded-full transition-all duration-300 ${state.currentTab === tab.id ? 'bg-blue-500 text-white shadow-md' : 'text-gray-600 dark:text-gray-400 hover:text-blue-500 dark:hover:text-blue-400'}">
                            <i data-lucide="${tab.icon}" class="w-6 h-6 md:w-5 md:h-5"></i>
                            <span class="text-xs font-medium mt-1 hidden sm:inline">${tab.label}</span>
                        </button>
                    `).join('')}
                </div>
            `;
            lucide.createIcons();
        };
        const renderModals = () => {
            const container = document.getElementById('modals-container');
            if (!state.isConfirmModalOpen) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
                    <div class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 text-center">
                        <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-2">${state.confirmTitle}</h3>
                        <p class="text-gray-600 dark:text-gray-300 mb-6">${state.confirmMessage}</p>
                        <div class="flex justify-center space-x-4">
                            <button onclick="updateState({ isConfirmModalOpen: false })" class="px-6 py-2 font-semibold text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 dark:bg-gray-600 dark:text-gray-200 dark:hover:bg-gray-500">${state.cancelText}</button>
                            <button onclick="state.confirmAction()" class="px-6 py-2 font-semibold text-white bg-red-500 rounded-lg hover:bg-red-600">${state.confirmText}</button>
                        </div>
                    </div>
                </div>
            `;
        };
        const renderTimer = () => {
            const mainEl = document.getElementById('main-content');
            const timeLeft = state.timeLeft;
            const totalDuration = getDuration();
            const progress = (totalDuration - timeLeft) / totalDuration * 100;
            const circumference = 2 * Math.PI * 45; // Circumference of circle with r=45
            const isFocus = state.mode === 'focus';
            const currentAnimationKey = isFocus ? state.settings.animations.focus : state.settings.animations.break;
            const backgroundUrl = isFocus ? backgroundImages.focus[currentAnimationKey] : backgroundImages.break[currentAnimationKey];
            const themeColors = { focus: { color: 'var(--color-focus)', progressClass: 'text-blue-500' }, shortBreak: { color: 'var(--color-short-break)', progressClass: 'text-green-500' }, longBreak: { color: 'var(--color-long-break)', progressClass: 'text-purple-600' } };
            const colors = themeColors[state.mode];
            const totalSessions = state.settings.pomodoro.sessionsBeforeLongBreak;
            const currentSessionIndexInCycle = state.sessionsCompleted % totalSessions;
            if (state.currentTab !== 'timer') return;
            mainEl.innerHTML = `
                <div class="w-full max-w-md mx-auto rounded-3xl shadow-lg relative overflow-hidden transition-all duration-500">
                    <!-- Background Animation/Image -->
                    <div class="absolute inset-0 bg-animated transition-all duration-1000 z-0" style="background-image: url('${backgroundUrl}');"></div>
                    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm z-10"></div>
                    
                    <div class="relative z-20 p-6 md:p-8 text-white">
                        <!-- Mode Tabs -->
                        <div class="flex justify-center mb-4 space-x-2">
                            ${[{ id: 'focus', label: tr('timer.focus') }, { id: 'shortBreak', label: tr('timer.shortBreak') }, { id: 'longBreak', label: tr('timer.longBreak') }].map(m => `
                                <button onclick="setTimerMode('${m.id}')"
                                    class="px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300
                                    ${state.mode === m.id ? `${themeColors[m.id].progressClass} bg-white text-gray-800` : 'bg-white/20 hover:bg-white/40 text-white'}">
                                    ${m.label}
                                </button>
                            `).join('')}
                        </div>
                        <!-- Session Progress Indicators -->
                        <div class="flex justify-center items-center space-x-2 mb-4">
                            ${Array.from({ length: totalSessions }).map((_, index) => {
                                const isCompleted = index < currentSessionIndexInCycle;
                                const isCurrent = index === currentSessionIndexInCycle && state.mode === 'focus';
                                const dotClass = isCurrent ? `${colors.progressClass} ring-2 ring-offset-2 ring-white/80 dark:ring-offset-gray-900/50` : (isCompleted ? colors.progressClass : 'bg-gray-300/50 dark:bg-gray-600/50');
                                return `
                                    <div key="${index}" class="w-5 h-5 rounded-full flex items-center justify-center transition-all duration-300 ${dotClass}"
                                        title="${tr('timer.session')} ${index + 1}">
                                        ${isCompleted ? '<i data-lucide="check" class="w-4 h-4 text-white"></i>' : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <!-- Timer Circle -->
                        <div id="timer-display" class="relative w-48 h-48 md:w-64 md:h-64 mx-auto mb-6">
                            <svg class="w-full h-full" viewBox="0 0 100 100">
                                <circle class="text-white/30" stroke-width="7" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50"></circle>
                                <circle class="progress-ring__circle ${colors.progressClass} transition-all duration-500"
                                    stroke-width="7" stroke-dasharray="${circumference}"
                                    stroke-dashoffset="${circumference - (progress / 100) * circumference}"
                                    stroke="currentColor" fill="transparent" r="45" cx="50" cy="50">
                                </circle>
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center text-4xl md:text-6xl font-bold text-white shadow-lg">
                                ${formatTime(timeLeft)}
                            </div>
                        </div>
                        <!-- Controls -->
                        <div class="flex items-center justify-center space-x-4">
                            <button onclick="toggleTimer()" class="px-8 py-3 text-xl font-bold text-gray-800 bg-white rounded-full transition-transform transform hover:scale-105 shadow-md ${colors.progressClass}">
                                ${state.isActive ? tr('timer.pause') : tr('timer.start')}
                            </button>
                            <button onclick="resetTimer()" class="p-3 text-white/80 rounded-full hover:bg-white/20 transition" title="Reiniciar">
                                <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
                            </button>
                            <button onclick="skipSession()" class="p-3 text-white/80 rounded-full hover:bg-white/20 transition" title="Saltar sesión">
                                <i data-lucide="skip-forward" class="w-6 h-6"></i>
                            </button>
                        </div>
                        <!-- Current Task Display -->
                        <div class="mt-6 pt-4 border-t border-white/20 text-center">
                            <p class="text-sm font-medium text-white/80">${tr('timer.currentTask')}</p>
                            <p class="text-lg font-semibold truncate text-white">
                                ${state.associatedTask ? state.associatedTask.text : tr('timer.noTask')}
                            </p>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };
        const renderTasks = () => {
            const mainEl = document.getElementById('main-content');
            if (state.currentTab !== 'tasks') return;
            const incompleteTasks = state.tasks.filter(t => !t.completed);
            const completedTasks = state.tasks.filter(t => t.completed);
            mainEl.innerHTML = `
                <div class="w-full max-w-md mx-auto p-6 bg-white dark:bg-gray-800 rounded-3xl shadow-xl">
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">${tr('tasks.title')}</h2>
                    
                    <!-- New Task Input -->
                    <form onsubmit="handleAddTask(event)" class="flex mb-6 space-x-2">
                        <input type="text" id="new-task-input" placeholder="${tr('tasks.placeholder')}" 
                            class="flex-grow p-3 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white transition" />
                        <button type="submit" class="p-3 bg-blue-500 text-white rounded-xl hover:bg-blue-600 transition shadow-md">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </button>
                    </form>
                    <!-- Incomplete Tasks List -->
                    <ul class="space-y-3">
                        ${incompleteTasks.map(task => `
                            <li class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700 rounded-xl shadow-sm transition-shadow hover:shadow-md">
                                <div class="flex items-center space-x-3 flex-grow">
                                    <input type="checkbox" id="task-${task.id}" ${task.completed ? 'checked' : ''} 
                                        onchange="toggleTask('${task.id}')" class="h-5 w-5 text-green-500 border-gray-300 rounded focus:ring-green-500 cursor-pointer" />
                                    <label for="task-${task.id}" class="text-lg flex-grow cursor-pointer ${task.completed ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-800 dark:text-gray-200'}">${task.text}</label>
                                </div>
                                <div class="flex space-x-2">
                                    <button onclick="associateTask('${task.id}')" title="${tr('tasks.selectTask')}"
                                        class="p-1 rounded-full transition ${state.associatedTask?.id === task.id ? 'bg-blue-500 text-white' : 'text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-600'}">
                                        <i data-lucide="target" class="w-5 h-5"></i>
                                    </button>
                                    <button onclick="requestDeleteTask('${task.id}')" title="${tr('confirm.confirm')}"
                                        class="p-1 rounded-full text-red-500 hover:bg-red-100 dark:hover:bg-red-900/50 transition">
                                        <i data-lucide="trash" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            </li>
                        `).join('')}
                    </ul>
                    <!-- Completed Tasks Separator -->
                    ${completedTasks.length > 0 ? `<h3 class="text-lg font-semibold text-gray-500 dark:text-gray-400 mt-6 mb-3 border-t pt-4">${tr('stats.completed')} (${completedTasks.length})</h3>` : ''}
                    <!-- Completed Tasks List -->
                    <ul class="space-y-2">
                        ${completedTasks.map(task => `
                            <li class="flex items-center justify-between p-3 bg-gray-100 dark:bg-gray-700/50 rounded-xl">
                                <div class="flex items-center space-x-3 flex-grow">
                                    <input type="checkbox" id="task-${task.id}" checked
                                        onchange="toggleTask('${task.id}')" class="h-5 w-5 text-green-500 border-gray-300 rounded focus:ring-green-500 cursor-pointer" />
                                    <label for="task-${task.id}" class="text-lg flex-grow line-through text-gray-500 dark:text-gray-400">${task.text}</label>
                                </div>
                                <button onclick="requestDeleteTask('${task.id}')" title="${tr('confirm.confirm')}" class="p-1 rounded-full text-red-500 hover:bg-red-100 dark:hover:bg-red-900/50 transition">
                                    <i data-lucide="trash" class="w-5 h-5"></i>
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
            lucide.createIcons();
        };
        const renderSettings = () => {
            const mainEl = document.getElementById('main-content');
            if (state.currentTab !== 'settings') return;
            const s = state.settings;
            const pomo = s.pomodoro;
            const notif = s.notifications;
            const anim = s.animations;
            mainEl.innerHTML = `
                <div class="w-full max-w-md mx-auto p-6 bg-white dark:bg-gray-800 rounded-3xl shadow-xl space-y-8">
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">${tr('tabs.settings')}</h2>
                    <!-- Pomodoro Settings -->
                    <div class="border-b border-gray-200 dark:border-gray-700 pb-4">
                        <h3 class="text-xl font-semibold mb-4">${tr('timer.focus')} / ${tr('timer.shortBreak')}</h3>
                        <div class="space-y-4">
                            ${[
                                { label: tr('timer.focus'), name: 'pomodoro.focusDuration', value: pomo.focusDuration, min: 1, max: 90 },
                                { label: tr('timer.shortBreak'), name: 'pomodoro.shortBreakDuration', value: pomo.shortBreakDuration, min: 1, max: 30 },
                                { label: tr('timer.longBreak'), name: 'pomodoro.longBreakDuration', value: pomo.longBreakDuration, min: 5, max: 60 },
                                { label: tr('timer.session'), name: 'pomodoro.sessionsBeforeLongBreak', value: pomo.sessionsBeforeLongBreak, min: 1, max: 10 },
                            ].map(setting => `
                                <div class="flex items-center justify-between">
                                    <label class="font-medium">${setting.label} ${setting.label === tr('timer.session') ? '' : '(min)'}</label>
                                    <input type="number" name="${setting.name}" value="${setting.value}" min="${setting.min}" max="${setting.max}"
                                        onchange="handleSettingsChange(event)"
                                        class="w-20 p-2 border border-gray-300 dark:border-gray-700 rounded-lg dark:bg-gray-700 text-center focus:ring-blue-500 focus:border-blue-500 transition" />
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <!-- Notification Settings -->
                    <div class="border-b border-gray-200 dark:border-gray-700 pb-4">
                        <h3 class="text-xl font-semibold mb-4">${tr('profile.notifications')}</h3>
                        <div class="space-y-4">
                            ${[
                                { label: tr('profile.notif_vibration'), name: 'notifications.vibration', checked: notif.vibration },
                                { label: tr('profile.notif_sound'), name: 'notifications.sound', checked: notif.sound },
                                { label: tr('profile.notif_snooze'), name: 'notifications.snooze', checked: notif.snooze },
                            ].map(setting => `
                                <div class="flex items-center justify-between">
                                    <label class="font-medium">${setting.label}</label>
                                    <input type="checkbox" name="${setting.name}" ${setting.checked ? 'checked' : ''}
                                        onchange="handleSettingsChange(event)"
                                        class="h-6 w-12 appearance-none rounded-full bg-gray-300 dark:bg-gray-700 checked:bg-blue-500 dark:checked:bg-blue-600 transition cursor-pointer"
                                        style="background-image: url('data:image/svg+xml,%3csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'-4 -4 8 8\'%3e%3ccircle r=\'3\' fill=\'%23fff\'/%3e%3c/svg%3e'); background-position: left center; background-repeat: no-repeat;"
                                        onchange="this.style.backgroundPosition = this.checked ? 'right center' : 'left center';" />
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <!-- Animation Settings -->
                    <div>
                        <h3 class="text-xl font-semibold mb-4">${tr('profile.focusAnimation')}</h3>
                        ${[{ key: 'focus', title: tr('timer.focus'), options: [{ id: 'forest', label: tr('profile.anim_forest') }, { id: 'rain', label: tr('profile.anim_rain') }, { id: 'fire', label: tr('profile.anim_fire') }] },
                           { key: 'break', title: tr('timer.shortBreak') + ' / ' + tr('timer.longBreak'), options: [{ id: 'waves', label: tr('profile.anim_waves') }, { id: 'clouds', label: tr('profile.anim_clouds') }, { id: 'zen', label: tr('profile.anim_zen') }] }
                        ].map(group => `
                            <p class="font-medium mt-3 mb-2">${group.title}</p>
                            <div class="flex flex-wrap gap-2">
                                ${group.options.map(opt => `
                                    <button onclick="handleSettingsChange({ target: { name: 'animations.${group.key}', value: '${opt.id}', type: 'text' } })"
                                        class="px-4 py-2 text-sm font-medium rounded-full transition-colors duration-200
                                        ${anim[group.key] === opt.id ? 'bg-blue-500 text-white shadow-md' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600'}">
                                        ${opt.label}
                                    </button>
                                `).join('')}
                            </div>
                        `).join('')}
                        
                        <p class="font-medium mt-6 mb-2">${tr('profile.language')}</p>
                        <select name="language" onchange="handleSettingsChange(event)" 
                            class="w-full p-3 border border-gray-300 dark:border-gray-700 rounded-lg dark:bg-gray-700 dark:text-white focus:ring-blue-500 focus:border-blue-500 transition">
                            ${Object.keys(translations).map(langCode => `
                                <option value="${langCode}" ${s.language === langCode ? 'selected' : ''}>${translations[langCode].profile.language} (${langCode.toUpperCase()})</option>
                            `).join('')}
                        </select>
                    </div>
                </div>
            `;
        };
        const renderProfile = () => {
             const mainEl = document.getElementById('main-content');
            if (state.currentTab !== 'profile') return;
            const u = state.user;
            mainEl.innerHTML = `
                <div class="w-full max-w-md mx-auto p-6 bg-white dark:bg-gray-800 rounded-3xl shadow-xl space-y-6 text-center">
                    
                    ${u ? `
                        <!-- Logged In State -->
                        <div class="flex flex-col items-center">
                            <img src="${u.photoURL || 'https://placehold.co/100x100/3b82f6/FFFFFF?text=U'}" alt="${u.displayName}" class="w-24 h-24 rounded-full mb-4 ring-4 ring-blue-500/50 object-cover">
                            <h2 class="text-2xl font-bold text-gray-800 dark:text-white">${tr('profile.welcome')}, ${u.displayName}</h2>
                            <p class="text-gray-500 dark:text-gray-400 mb-6">${u.email}</p>
                            <button onclick="mockLogout()" class="px-8 py-3 text-lg font-bold text-white bg-red-500 rounded-full hover:bg-red-600 transition shadow-md flex items-center space-x-2">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                                <span>${tr('profile.logout')}</span>
                            </button>
                            <div class="mt-8 p-4 bg-gray-100 dark:bg-gray-700 rounded-xl w-full">
                                <p class="text-sm font-semibold">${tr('profile.language')}: <span class="text-blue-500">${state.settings.language.toUpperCase()}</span></p>
                            </div>
                        </div>
                    ` : `
                        <!-- Logged Out State -->
                        <div class="py-4">
                            <i data-lucide="user-circle" class="w-20 h-20 mx-auto text-blue-500 mb-4"></i>
                            <h2 class="text-2xl font-bold text-gray-800 dark:text-white">${tr('profile.welcome')}</h2>
                            <p class="text-gray-600 dark:text-gray-400 mb-6">${tr('profile.welcomeBody')}</p>
                            <div class="space-y-4">
                                <input type="email" id="login-email" placeholder="${tr('profile.emailPlaceholder')}" 
                                    class="w-full p-3 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white transition" />
                                <button onclick="mockLogin()" class="w-full px-8 py-3 text-lg font-bold text-white bg-blue-500 rounded-full hover:bg-blue-600 transition shadow-md flex items-center justify-center space-x-2">
                                    <i data-lucide="log-in" class="w-5 h-5"></i>
                                    <span>${tr('profile.login')}</span>
                                </button>
                            </div>
                            <p class="text-xs text-gray-400 mt-4">(Simulación de inicio de sesión con el email ingresado)</p>
                        </div>
                    `}
                </div>
            `;
             lucide.createIcons();
        };
        window.mockLogin = () => {
            const email = document.getElementById('login-email').value;
            if (!email || !email.includes('@')) {
                 setNotification("Error", "Por favor ingresa un email válido.", "error");
                 return;
            }
            const mockUser = {
                uid: `mock_${crypto.randomUUID()}`,
                email: email,
                displayName: email.split('@')[0],
                photoURL: `https://placehold.co/100x100/3b82f6/FFFFFF?text=${email.charAt(0).toUpperCase()}`
            };
            updateState({ user: mockUser });
            setNotification(tr('notifications.loggedIn'), "¡Genial! Ya puedes estudiar con amigos.", "success");
        };
        window.mockLogout = () => {
            updateState({ user: null });
            setNotification(tr('notifications.loggedOut'), "Puedes seguir estudiando por tu cuenta.", "info");
        };
        const renderContent = () => {
            switch (state.currentTab) {
                case 'timer':
                    renderTimer();
                    break;
                case 'tasks':
                    renderTasks();
                    break;
                case 'settings':
                    renderSettings();
                    break;
                case 'profile':
                    renderProfile();
                    break;
                case 'stats':
                    document.getElementById('main-content').innerHTML = '<div class="w-full max-w-md mx-auto p-6 bg-white dark:bg-gray-800 rounded-3xl shadow-xl text-center"><h2 class="text-2xl font-bold mb-4">Estadísticas</h2><p class="text-gray-500">Funcionalidad pendiente. ¡Sigue concentrándote!</p></div>';
                    break;
                default:
                    renderTimer();
            }
        };
        // --- MAIN RENDER LOOP ---
        const renderApp = () => {
            applyTheme();
            renderHeader();
            renderNav();
            renderContent();
            renderModals(); // Always check for modals
        };
        // --- INITIALIZATION ---
        window.onload = () => {
            // Set initial time left based on settings
            state.timeLeft = getDuration();
            
            // Set initial associated task
            if (state.tasks.length > 0) {
                 state.associatedTask = state.tasks[0];
            }
            // Start Firebase setup
            window.initFirebaseAndAuth();
            // Initial render
            renderApp();
        };
    </script>
</body>
</html>
